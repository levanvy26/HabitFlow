                  previousText={`${weekAnalytics.lastWeekElapsedActual}/${weekAnalytics.elapsedDays}d (${weekAnalytics.lastWeekRate.toFixed(1)}%)`}
                  deltaAbs={weekAnalytics.deltaAbs}
                  deltaRate={weekAnalytics.deltaRate}
                  pctChange={weekAnalytics.pctChange}
                  timeframe={weekAnalytics.timeframe}
                  comment={weekAnalytics.comment}
                />

                <GrowthSummaryCard
                  title="Tăng trưởng Tháng"
                  trend={monthAnalytics.trend}
                  currentText={`${monthAnalytics.thisMonthActual}/${monthAnalytics.currentDayOfMonth}d (${monthAnalytics.thisMonthRate.toFixed(1)}%)`}
                  previousText={`${monthAnalytics.lastMonthElapsedActual}/${monthAnalytics.compareDaysMonth}d (${monthAnalytics.lastMonthRate.toFixed(1)}%)`}
                  deltaAbs={monthAnalytics.deltaAbs}
                  deltaRate={monthAnalytics.deltaRate}
                  pctChange={monthAnalytics.pctChange}
                  timeframe={monthAnalytics.timeframe}
                  comment={monthAnalytics.comment}
                />

                <GrowthSummaryCard
                  title="Tăng trưởng Năm"
                  trend={yearAnalytics.trend}
                  currentText={`${yearAnalytics.thisYearActual}/${yearAnalytics.dayOfYear}d (${yearAnalytics.thisYearRate.toFixed(1)}%)`}
                  previousText={`${yearAnalytics.lastYearElapsedActual}/${yearAnalytics.dayOfYear}d (${yearAnalytics.lastYearRate.toFixed(1)}%)`}
                  deltaAbs={yearAnalytics.deltaAbs}
                  deltaRate={yearAnalytics.deltaRate}
                  pctChange={yearAnalytics.pctChange}
                  timeframe={yearAnalytics.timeframe}
                  comment={yearAnalytics.comment}
                />
              </div>
            </section>

          </div>
        </div>
      );
    }

    // ==========================================
    // 5.9. FOCUS TIMER & NUMERIC TRACKING MODAL (SINGLE-RESPONSIBILITY COMPONENT)
    // ==========================================
    function FocusTimerModal({ habit, todayLog, todayStr, onClose, onSaveSession }) {
      const normalizedToday = useMemo(() => normalizeLogEntry(todayLog), [todayLog]);
      const targetMinutes = Number(habit?.targetMinutes) || 0;
      const defaultPomodoroMins = targetMinutes > 0 && targetMinutes <= 90 ? targetMinutes : 25;

      // Mode: 'pomodoro' | 'stopwatch'
      const [mode, setMode] = useState('pomodoro');
      // Pomodoro phase: 'work' | 'break'
      const [pomodoroPhase, setPomodoroPhase] = useState('work');
      const [workMinutes, setWorkMinutes] = useState(defaultPomodoroMins);
      const [breakMinutes, setBreakMinutes] = useState(5);

      // Anti-throttling timer refs & state (Timestamp Delta: Date.now() - startTime)
      const [isRunning, setIsRunning] = useState(false);
      const [elapsedMs, setElapsedMs] = useState(0);
      const startTimeRef = useRef(null);
      const accumulatedMsRef = useRef(0);
      const sessionStartIsoRef = useRef(null);

      // End-of-session Quick Note state
      const [isFinishing, setIsFinishing] = useState(false);
      const [quickNote, setQuickNote] = useState('');

      const phaseTargetMs = useMemo(() => {
        if (mode !== 'pomodoro') return Math.max(1, targetMinutes || 25) * 60 * 1000;
        const mins = pomodoroPhase === 'work' ? Math.max(1, Number(workMinutes) || 25) : Math.max(1, Number(breakMinutes) || 5);
        return mins * 60 * 1000;
      }, [mode, pomodoroPhase, workMinutes, breakMinutes, targetMinutes]);

      // Synchronize elapsed time from wall-clock delta (immune to WebView2 background throttling)
      const syncElapsedFromClock = useCallback(() => {
        if (startTimeRef.current === null) {
          return accumulatedMsRef.current;
        }
        const now = Date.now();
        const totalMs = computeTimerElapsedMs(startTimeRef.current, now, accumulatedMsRef.current);

        if (mode === 'pomodoro' && totalMs >= phaseTargetMs) {
          // Phase reached target duration
          startTimeRef.current = null;
          accumulatedMsRef.current = phaseTargetMs;
          setElapsedMs(phaseTargetMs);
          setIsRunning(false);
          if (pomodoroPhase === 'work') {
            setIsFinishing(true);
          }
          return phaseTargetMs;
        }

        setElapsedMs(totalMs);
        return totalMs;
      }, [mode, phaseTargetMs, pomodoroPhase]);

      useEffect(() => {
        if (!isRunning) return;
        const intervalId = setInterval(syncElapsedFromClock, 250);
        const handleVisibilityOrFocus = () => {
          syncElapsedFromClock();
        };
        document.addEventListener('visibilitychange', handleVisibilityOrFocus);
        window.addEventListener('focus', handleVisibilityOrFocus);
        return () => {
          clearInterval(intervalId);
          document.removeEventListener('visibilitychange', handleVisibilityOrFocus);
          window.removeEventListener('focus', handleVisibilityOrFocus);
        };
      }, [isRunning, syncElapsedFromClock]);

      // Close on Escape key when not actively running
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && !isRunning) onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose, isRunning]);

      const handleStartPause = () => {
        if (isRunning) {
          const total = syncElapsedFromClock();
          accumulatedMsRef.current = total;
          startTimeRef.current = null;
          setIsRunning(false);
        } else {
          if (!sessionStartIsoRef.current) {
            sessionStartIsoRef.current = new Date().toISOString();
          }
          if (mode === 'pomodoro' && accumulatedMsRef.current >= phaseTargetMs) {
            accumulatedMsRef.current = 0;
            setElapsedMs(0);
          }
          startTimeRef.current = Date.now();
          setIsFinishing(false);
          setIsRunning(true);
        }
      };

      const handleReset = () => {
        startTimeRef.current = null;
        accumulatedMsRef.current = 0;
        sessionStartIsoRef.current = null;
        setIsRunning(false);
        setElapsedMs(0);
        setIsFinishing(false);
      };

      const handleSwitchMode = (nextMode) => {
        if (nextMode === mode) return;
        handleReset();
        setMode(nextMode);
        setPomodoroPhase('work');
      };

      const handleApplyPreset = (wMins, bMins) => {
        handleReset();
        setMode('pomodoro');
        setPomodoroPhase('work');
        setWorkMinutes(wMins);
        setBreakMinutes(bMins);
      };

      const handleOpenFinishPanel = () => {
        if (isRunning) {
          const total = syncElapsedFromClock();
          accumulatedMsRef.current = total;
          startTimeRef.current = null;
          setIsRunning(false);
        }
        setIsFinishing(true);
      };

      // Session duration in minutes (minimum 0.1m if > 0s, rounded to 2 decimals)
      const sessionMinutes = useMemo(() => {
        if (elapsedMs <= 0) return 0;
        const rawMins = elapsedMs / 60000;
        return Math.max(0.1, Math.round(rawMins * 100) / 100);
      }, [elapsedMs]);

      const projectedTotalMinutes = useMemo(() => {
        if (mode === 'pomodoro' && pomodoroPhase === 'break') {
          return normalizedToday.focusMinutes;
        }
        return Math.round((normalizedToday.focusMinutes + sessionMinutes) * 100) / 100;
      }, [normalizedToday.focusMinutes, sessionMinutes, mode, pomodoroPhase]);

      const willAutoComplete = targetMinutes > 0 && projectedTotalMinutes >= targetMinutes;

      const handleCommitSession = (e) => {
        if (e) e.preventDefault();
        const durationToSave = sessionMinutes > 0
          ? Math.max(1, Math.round(sessionMinutes))
          : (mode === 'pomodoro' ? Number(workMinutes) || 25 : 1);

        onSaveSession(
          habit,
          {
            start: sessionStartIsoRef.current || new Date(Date.now() - durationToSave * 60000).toISOString(),
            end: new Date().toISOString(),
            duration: durationToSave,
            mode,
            note: quickNote.trim()
          },
          todayStr
        );

        handleReset();
        setQuickNote('');
        if (mode === 'pomodoro' && pomodoroPhase === 'work') {
          setPomodoroPhase('break');
        }
      };

      const displayClockMs = mode === 'pomodoro'
        ? Math.max(0, phaseTargetMs - elapsedMs)
        : elapsedMs;

      const progressPct = useMemo(() => {
        if (mode === 'pomodoro') {
          return phaseTargetMs > 0 ? Math.min(100, (elapsedMs / phaseTargetMs) * 100) : 0;
        }
        if (targetMinutes > 0) {
          return Math.min(100, (projectedTotalMinutes / targetMinutes) * 100);
        }
        return Math.min(100, (elapsedMs / (25 * 60 * 1000)) * 100);
      }, [mode, elapsedMs, phaseTargetMs, targetMinutes, projectedTotalMinutes]);

      const habitColor = habit?.color || '#6366F1';

      return (
        <div
          className="animate-modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 liquid-glass-backdrop"
          onClick={(e) => {
            if (e.target === e.currentTarget && !isRunning) onClose();
          }}
        >
          <div
            className="animate-modal-dialog w-full max-w-lg max-h-[92vh] overflow-y-auto p-6 rounded-3xl liquid-glass-modal flex flex-col gap-5 shadow-2xl custom-scrollbar"
            role="dialog"
            aria-modal="true"
            aria-labelledby="focus-timer-modal-title"
          >
            {/* Header */}
            <header className="flex items-center justify-between gap-3 pb-3 border-b border-slate-200/60 dark:border-white/10">
              <div className="flex items-center gap-3 min-w-0">
                <div
                  className="w-10 h-10 rounded-2xl flex items-center justify-center text-white shadow-md shrink-0"
                  style={{ backgroundColor: habitColor, boxShadow: `0 6px 18px ${habitColor}50` }}
                >
                  <Icon name={habit?.icon || 'clock'} className="w-5 h-5" />
                </div>
                <div className="min-w-0">
                  <span className="editorial-eyebrow text-emerald-500">
                    Focus Timer & Theo Dõi Định Lượng
                  </span>
                  <h3 id="focus-timer-modal-title" className="text-base md:text-lg font-serif font-bold text-slate-900 dark:text-white truncate">
                    {habit?.name}
                  </h3>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                aria-label="Đóng Focus Timer"
                className="spring-button p-1.5 rounded-xl liquid-glass-control text-slate-400 hover:text-slate-700 dark:hover:text-white"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </header>

            {/* Mode Switcher: Pomodoro vs Stopwatch */}
            <div className="flex items-center justify-between gap-2">
              <div className="grid grid-cols-2 gap-1.5 p-1 rounded-2xl liquid-glass-control flex-1" role="tablist" aria-label="Chế độ đồng hồ tập trung">
                <button
                  type="button"
                  role="tab"
                  aria-selected={mode === 'pomodoro'}
                  onClick={() => handleSwitchMode('pomodoro')}
                  className={`spring-pill py-1.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                    mode === 'pomodoro'
                      ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/30'
                      : 'text-slate-500 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  <Icon name="clock" className="w-3.5 h-3.5" />
                  <span>Pomodoro</span>
                </button>
                <button
                  type="button"
                  role="tab"
                  aria-selected={mode === 'stopwatch'}
                  onClick={() => handleSwitchMode('stopwatch')}
                  className={`spring-pill py-1.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                    mode === 'stopwatch'
                      ? 'bg-emerald-600 text-white shadow-md shadow-emerald-500/30'
                      : 'text-slate-500 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  <Icon name="activity" className="w-3.5 h-3.5" />
                  <span>Stopwatch (Tự do)</span>
                </button>
              </div>
            </div>

            {/* Pomodoro Presets & Custom Inputs */}
            {mode === 'pomodoro' && (
              <div className="flex flex-wrap items-center justify-between gap-2 px-3 py-2 rounded-2xl liquid-glass-control text-xs">
                <div className="flex items-center gap-1.5 flex-wrap">
                  {[
                    { label: '25 / 5m', w: 25, b: 5 },
                    { label: '50 / 10m', w: 50, b: 10 },
                    { label: '15 / 3m', w: 15, b: 3 }
                  ].map(preset => {
                    const active = Number(workMinutes) === preset.w && Number(breakMinutes) === preset.b;
                    return (
                      <button
                        key={preset.label}
                        type="button"
                        disabled={isRunning}
                        onClick={() => handleApplyPreset(preset.w, preset.b)}
                        className={`spring-pill px-2.5 py-1 rounded-xl font-mono text-[11px] font-bold border transition ${
                          active
                            ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/40'
                            : 'border-transparent text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
                        } ${isRunning ? 'opacity-50 cursor-not-allowed' : ''}`}
                      >
                        {preset.label}
                      </button>
                    );
                  })}
                </div>

                <div className="flex items-center gap-2 font-mono text-[11px]">
                  <label className="flex items-center gap-1 text-slate-400">
                    <span>Tập trung:</span>
                    <input
                      type="number"
                      min="1"
                      max="240"
                      disabled={isRunning}
                      value={workMinutes}
                      onChange={e => {
                        const val = Math.max(1, Math.min(240, Number(e.target.value) || 25));
                        setWorkMinutes(val);
                        if (pomodoroPhase === 'work') {
                          accumulatedMsRef.current = 0;
                          setElapsedMs(0);
                        }
                      }}
                      className="w-12 px-1.5 py-0.5 rounded-lg bg-slate-900/40 border border-white/10 text-center font-bold text-slate-800 dark:text-white"
                      aria-label="Số phút Pomodoro tập trung"
                    />
                  </label>
                  <button
                    type="button"
                    disabled={isRunning}
                    onClick={() => {
                      handleReset();
                      setPomodoroPhase(prev => prev === 'work' ? 'break' : 'work');
                    }}
                    className={`spring-pill px-2 py-0.5 rounded-lg text-[10px] font-bold border ${
                      pomodoroPhase === 'break'
                        ? 'bg-amber-500/20 text-amber-400 border-amber-500/40'
                        : 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30'
                    }`}
                    title="Chuyển pha Tập trung / Nghỉ ngắn"
                  >
                    {pomodoroPhase === 'work' ? '🎯 Pha Tập trung' : `☕ Nghỉ ${breakMinutes}m`}
                  </button>
                </div>
              </div>
            )}

            {/* Central Anti-Throttling Horological Dial */}
            <div className="relative flex flex-col items-center justify-center py-4 px-6 rounded-3xl liquid-glass-card border border-white/15">
              <div className="relative w-48 h-48 flex items-center justify-center">
                <svg className="w-full h-full -rotate-90" viewBox="0 0 160 160" aria-hidden="true">
                  <circle
                    cx="80"
                    cy="80"
                    r="68"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="8"
                    className="text-slate-200/70 dark:text-white/10"
                  />
                  <circle
                    cx="80"
                    cy="80"
                    r="68"
                    fill="none"
                    stroke={pomodoroPhase === 'break' && mode === 'pomodoro' ? '#F59E0B' : habitColor}
                    strokeWidth="8"
                    strokeLinecap="round"
                    strokeDasharray={2 * Math.PI * 68}
                    strokeDashoffset={2 * Math.PI * 68 * (1 - Math.min(100, Math.max(0, progressPct)) / 100)}
                    style={{ transition: 'stroke-dashoffset 0.25s ease-out' }}
                  />
                </svg>

                <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                  <span className="text-[10px] font-mono uppercase tracking-widest text-slate-400">
                    {mode === 'pomodoro'
                      ? (pomodoroPhase === 'work' ? 'Đếm ngược Pomodoro' : 'Nghỉ giải lao')
                      : 'Bấm giờ tự do'}
                  </span>
                  <div
                    className="text-4xl font-mono font-extrabold tracking-tight text-slate-900 dark:text-white mt-1"
                    data-testid="focus-timer-clock"
                  >
                    {formatTimerClock(displayClockMs, true)}
                  </div>
                  <span className="text-[11px] font-mono text-emerald-500 font-semibold mt-1">
                    +{formatFocusDuration(Math.round(sessionMinutes * 10) / 10)} phiên này
                  </span>
                </div>
              </div>

              {/* Target Auto-Completion Progress Strip */}
              <div className="w-full mt-3 pt-3 border-t border-slate-200/50 dark:border-white/10 flex items-center justify-between text-xs">
                <div className="flex items-center gap-1.5">
                  <span className="text-slate-400">Hôm nay:</span>
                  <strong className="font-mono text-slate-800 dark:text-white">
                    {formatFocusDuration(projectedTotalMinutes)}
                  </strong>
                  {targetMinutes > 0 && (
                    <span className="font-mono text-slate-400">
                      / mục tiêu {formatFocusDuration(targetMinutes)}
                    </span>
                  )}
                </div>

                {willAutoComplete || normalizedToday.completed ? (
                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-mono text-[11px] font-bold">
                    <Icon name="check" className="w-3 h-3" />
                    <span>{normalizedToday.completed ? 'Đã hoàn thành ngày' : 'Đạt mốc -> Tự động hoàn thành'}</span>
                  </span>
                ) : targetMinutes > 0 ? (
                  <span className="font-mono text-[11px] text-amber-400">
                    Còn {formatFocusDuration(Math.max(0, Math.ceil(targetMinutes - projectedTotalMinutes)))} để tự động hoàn thành
                  </span>
                ) : null}
              </div>

              {/* Primary Timer Controls */}
              <div className="mt-4 flex items-center justify-center gap-3 w-full">
                <button
                  type="button"
                  onClick={handleReset}
                  className="spring-button px-3.5 py-2 rounded-xl liquid-glass-control text-xs font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1.5"
                  title="Đặt lại đồng hồ về 0"
                >
                  <Icon name="rotate-ccw" className="w-4 h-4" />
                  <span>Đặt lại</span>
                </button>

                <button
                  type="button"
                  onClick={handleStartPause}
                  className={`spring-button px-6 py-2.5 rounded-2xl text-xs font-bold text-white shadow-lg flex items-center gap-2 border border-white/20 ${
                    isRunning
                      ? 'bg-gradient-to-r from-amber-500 to-orange-500 shadow-amber-500/30'
                      : 'bg-gradient-to-r from-indigo-600 to-blue-600 shadow-indigo-500/30'
                  }`}
                >
                  <Icon name={isRunning ? 'pause' : 'play'} className="w-4 h-4" />
                  <span>{isRunning ? 'Tạm dừng' : (elapsedMs > 0 ? 'Tiếp tục' : 'Bắt đầu tập trung')}</span>
                </button>

                <button
                  type="button"
                  onClick={handleOpenFinishPanel}
                  className="spring-button px-3.5 py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-500 border border-emerald-500/30 text-xs font-bold flex items-center gap-1.5"
                  title="Kết thúc phiên và ghi chú nhanh"
                >
                  <Icon name="check" className="w-4 h-4" />
                  <span>Kết thúc phiên</span>
                </button>
              </div>
            </div>

            {/* Quick Note Input Panel on Session Finish */}
            {isFinishing && (
              <form
                onSubmit={handleCommitSession}
                className="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex flex-col gap-3 animate-tab-content"
              >
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-emerald-400 flex items-center gap-1.5">
                    <Icon name="check" className="w-4 h-4" />
                    <span>Lưu phiên tập trung ({formatFocusDuration(sessionMinutes > 0 ? Math.max(1, Math.round(sessionMinutes)) : workMinutes)})</span>
                  </span>
                  {targetMinutes > 0 && (normalizedToday.focusMinutes + (sessionMinutes > 0 ? Math.max(1, Math.round(sessionMinutes)) : workMinutes)) >= targetMinutes && (
                    <span className="text-[11px] font-mono font-bold text-emerald-400">
                      ✓ Tự động đánh dấu hoàn thành
                    </span>
                  )}
                </div>

                <div>
                  <label htmlFor="focus-quick-note-input" className="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">
                    Ghi chú nhanh (Quick Note) cho phiên tập trung:
                  </label>
                  <input
                    id="focus-quick-note-input"
                    type="text"
                    placeholder="Ví dụ: Hoàn thành chương 2 Giải tích, giải 5 bài tập..."
                    value={quickNote}
                    onChange={e => setQuickNote(e.target.value)}
                    autoFocus
                    className="w-full px-3 py-2 rounded-xl liquid-glass-control text-xs text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div className="flex items-center justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setIsFinishing(false)}
                    className="spring-button px-3 py-1.5 rounded-xl liquid-glass-control text-xs font-semibold text-slate-500 dark:text-slate-300"
                  >
                    Quay lại
                  </button>
                  <button
                    type="submit"
                    className="spring-button px-4 py-1.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-bold shadow-md shadow-emerald-600/30 border border-white/20"
                  >
                    Lưu phiên & Ghi chú
                  </button>
                </div>
              </form>
            )}

            {/* Today's Recorded Focus Sessions List */}
            {normalizedToday.sessions.length > 0 && (
              <div className="pt-2 border-t border-slate-200/50 dark:border-white/10 flex flex-col gap-2 text-xs">
                <div className="flex items-center justify-between text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                  <span>Lịch sử phiên hôm nay ({normalizedToday.sessions.length} phiên)</span>
                  <span className="font-mono text-emerald-400">Tổng: {formatFocusDuration(normalizedToday.focusMinutes)}</span>
                </div>
                <div className="max-h-32 overflow-y-auto flex flex-col gap-1.5 pr-1 custom-scrollbar">
                  {normalizedToday.sessions.map((s, idx) => (
                    <div
                      key={idx}
                      className="px-3 py-2 rounded-xl liquid-glass-control flex items-center justify-between gap-2 text-xs"
                    >
                      <div className="flex items-center gap-2 min-w-0">
                        <span className="px-1.5 py-0.5 rounded bg-indigo-500/15 text-indigo-400 font-mono text-[10px] font-bold uppercase shrink-0">
                          {s.mode === 'stopwatch' ? 'Stopwatch' : 'Pomodoro'}
                        </span>
                        <span className="truncate text-slate-700 dark:text-slate-200 font-medium">
                          {s.note || 'Phiên tập trung tiêu chuẩn'}
                        </span>
                      </div>
                      <span className="font-mono font-bold text-emerald-500 shrink-0">
                        +{formatFocusDuration(s.duration)}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. HABIT MODAL (ADD / EDIT)
    // ==========================================
    function HabitModal({ editingHabit, onClose, onSave, categories = [], onOpenCategoryModal }) {
      const [name, setName] = useState(editingHabit?.name || '');
      const [category, setCategory] = useState(editingHabit?.category || categories[0]?.name || 'Học tập');
      const [color, setColor] = useState(editingHabit?.color || '#3B82F6');
      const [icon, setIcon] = useState(editingHabit?.icon || 'book-open');
      const [targetMinutes, setTargetMinutes] = useState(editingHabit?.targetMinutes ?? 25);

      // Close on Escape key (R3 WAI-ARIA)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      const presetColors = [
        '#3B82F6', // Blue
        '#10B981', // Emerald
        '#8B5CF6', // Purple
        '#F59E0B', // Amber
        '#EC4899', // Pink
        '#06B6D4', // Cyan
        '#F97316', // Orange
        '#6366F1'  // Indigo
      ];

      const presetIcons = [
        'book-open',
        'activity',
        'file-text',
        'code',
        'droplet',
        'flame',
        'zap',
        'heart',
        'star',
        'target'
      ];

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSave({
          ...(editingHabit || {}),
          name: name.trim(),
          category,
          color,
          icon,
          targetMinutes: Math.max(0, Number(targetMinutes) || 0)
        });
      };

      return (
        <div
          className="animate-modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 liquid-glass-backdrop"
          onClick={(e) => {
            if (e.target === e.currentTarget) onClose();
          }}
        >
          <div
            className="animate-modal-dialog w-full max-w-md max-h-[90vh] flex flex-col p-6 rounded-2xl liquid-glass-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="habit-modal-title"
          >
            <header className="flex items-center justify-between pb-3 border-b border-slate-200/50 dark:border-white/[0.08] shrink-0">
              <h3 id="habit-modal-title" className="text-lg font-serif font-bold text-slate-900 dark:text-white tracking-wide">
                {editingHabit ? 'Chỉnh sửa thói quen' : 'Thêm thói quen mới'}
              </h3>
              <button
                type="button"
                onClick={onClose}
                aria-label="Đóng hộp thoại thói quen"
                className="spring-button p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </header>

            <form onSubmit={handleSubmit} className="mt-4 flex flex-col gap-4 text-xs flex-1 overflow-y-auto pr-1">
              {/* Habit Name */}
              <div>
                <label htmlFor="habit-name-input" className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                  Tên thói quen *
                </label>
                <input
                  id="habit-name-input"
                  type="text"
                  required
                  placeholder="Ví dụ: Đọc sách 30 phút..."
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl liquid-glass-control text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:text-slate-400"
                />
              </div>

              {/* Target Focus Minutes (Numeric Tracking Goal) */}
              <div>
                <div className="flex items-center justify-between mb-1">
                  <label htmlFor="habit-target-minutes-input" className="font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
                    <Icon name="clock" className="w-3.5 h-3.5 text-emerald-500" />
                    <span>Mục tiêu thời lượng tập trung / ngày (phút)</span>
                  </label>
                  <span className="font-mono text-[11px] text-emerald-500 font-bold">
                    {Number(targetMinutes) > 0 ? formatFocusDuration(targetMinutes) : 'Không giới hạn'}
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <input
                    id="habit-target-minutes-input"
                    type="number"
                    min="0"
                    max="720"
                    value={targetMinutes}
                    onChange={e => setTargetMinutes(Math.max(0, Number(e.target.value) || 0))}
                    className="w-24 px-3 py-1.5 rounded-xl liquid-glass-control font-mono font-bold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                  <div className="flex items-center gap-1 flex-wrap">
                    {[15, 25, 30, 45, 60].map(m => (
                      <button
                        key={m}
                        type="button"
                        onClick={() => setTargetMinutes(m)}
                        className={`spring-pill px-2 py-1 rounded-lg font-mono text-[11px] font-semibold border ${
                          Number(targetMinutes) === m
                            ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40'
                            : 'liquid-glass-control text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
                        }`}
                      >
                        {m}m
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Dynamic Category Selector */}
              <div>
                <div className="flex items-center justify-between mb-1">
                  <label className="font-semibold text-slate-700 dark:text-slate-300">
                    Danh mục *
                  </label>
                  {onOpenCategoryModal && (
                    <button
                      type="button"
                      onClick={onOpenCategoryModal}
                      className="spring-pill text-[11px] text-indigo-500 hover:text-indigo-400 font-semibold flex items-center gap-1"
                    >
                      <Icon name="plus" className="w-3 h-3" />
                      <span>Thêm danh mục mới</span>
                    </button>
                  )}
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 max-h-36 overflow-y-auto p-1.5 rounded-xl liquid-glass-control" role="group" aria-label="Chọn danh mục">
                  {categories.map(cat => (
                    <LucianCategoryChip
                      key={cat.id || cat.name}
                      name={cat.name}
                      icon={cat.icon}
                      color={cat.color}
                      isActive={category === cat.name}
                      onClick={() => setCategory(cat.name)}
                      className="w-full justify-center"
                    />
                  ))}
                </div>
              </div>

              {/* Color Palette */}
              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                  Màu sắc đại diện
                </label>
                <div className="flex items-center gap-2" role="group" aria-label="Chọn màu sắc đại diện">
                  {presetColors.map(c => (
                    <button
                      key={c}
                      type="button"
                      aria-pressed={color === c}
                      aria-label={`Màu ${c}`}
                      onClick={() => setColor(c)}
                      className={`spring-pill w-7 h-7 rounded-xl ${
                        color === c ? 'ring-2 ring-white ring-offset-2 dark:ring-offset-[#111827] scale-110 shadow-md' : ''
                      }`}
                      style={{ backgroundColor: c, boxShadow: color === c ? `0 4px 12px ${c}70` : 'none' }}
                    />
                  ))}
                </div>
              </div>

              {/* Icon Palette */}
              <div>
                <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                  Biểu tượng
                </label>
                <div className="grid grid-cols-5 gap-2" role="group" aria-label="Chọn biểu tượng thói quen">
                  {presetIcons.map(ic => (
                    <button
                      key={ic}
                      type="button"
                      aria-pressed={icon === ic}
                      aria-label={`Biểu tượng ${ic}`}
                      onClick={() => setIcon(ic)}
                      className={`spring-pill p-2 rounded-xl flex items-center justify-center ${
                        icon === ic
                          ? 'border border-indigo-500 bg-indigo-500/20 text-indigo-400 shadow-sm'
                          : 'liquid-glass-control text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'
                      }`}
                    >
                      <Icon name={ic} className="w-5 h-5" />
                    </button>
                  ))}
                </div>
              </div>

              {/* Form Buttons */}
              <footer className="mt-2 pt-3 border-t border-slate-200/50 dark:border-white/[0.08] flex items-center justify-end gap-2.5 shrink-0">
                <button
                  type="button"
                  onClick={onClose}
                  className="spring-button px-4 py-2 rounded-xl liquid-glass-control font-semibold text-slate-700 dark:text-slate-300 hover:brightness-110"
                >
                  Hủy
                </button>
                <LucianGlassButton
                  type="submit"
                  variant="primary"
                >
                  Lưu thói quen
                </LucianGlassButton>
              </footer>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. CATEGORY MODAL (MANAGE & ADD)
    // ==========================================
    function CategoryModal({ categories, onClose, onSaveCategory, onDeleteCategory, habits }) {
      const [editingCat, setEditingCat] = useState(null);
      const [deletingCat, setDeletingCat] = useState(null);
      const [name, setName] = useState('');
      const [color, setColor] = useState('#6366F1');
      const [icon, setIcon] = useState('book-open');

      // Close on Escape key (R3 WAI-ARIA)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (deletingCat) {
              setDeletingCat(null);
            } else {
              onClose();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [deletingCat, onClose]);

      const presetColors = [
        '#6366F1', // Indigo
        '#3B82F6', // Blue
        '#06B6D4', // Cyan
        '#10B981', // Emerald
        '#F59E0B', // Amber
        '#F97316', // Orange
        '#F43F5E', // Rose
        '#EC4899', // Pink
        '#8B5CF6', // Purple
        '#14B8A6'  // Teal
      ];

      const presetIcons = [
        'book-open',
        'code',
        'activity',
        'heart',
        'droplet',
        'star',
        'target',
        'award',
        'zap',
        'layers',
        'flame',
        'file-text'
      ];

      const handleStartEdit = (cat) => {
        setEditingCat(cat);
        setName(cat.name);
        setColor(cat.color);
        setIcon(cat.icon);
      };

      const handleResetForm = () => {
        setEditingCat(null);
        setName('');
        setColor('#6366F1');
        setIcon('book-open');
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSaveCategory({
          id: editingCat?.id,
          name: name.trim(),
          color,
          icon
        });
        handleResetForm();
      };

      return (
        <div
          className="animate-modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 liquid-glass-backdrop"
          onClick={(e) => {
            if (e.target === e.currentTarget && !deletingCat) onClose();
          }}
        >
          <div
            className="animate-modal-dialog w-full max-w-lg p-6 rounded-2xl liquid-glass-modal max-h-[90vh] flex flex-col"
            role="dialog"
            aria-modal="true"
            aria-labelledby="category-modal-title"
          >
            <header className="flex items-center justify-between pb-3 border-b border-slate-200/50 dark:border-white/[0.08]">
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center border border-indigo-500/30" aria-hidden="true">
                  <Icon name="layers" className="w-4 h-4" />
                </div>
                <h3 id="category-modal-title" className="text-lg font-serif font-bold text-slate-900 dark:text-white tracking-wide">
                  Quản lý danh mục thói quen
                </h3>
              </div>
              <button
                type="button"
                onClick={onClose}
                aria-label="Đóng hộp thoại danh mục"
                className="spring-button p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </header>

            <div className="flex-1 overflow-y-auto py-4 flex flex-col gap-5 text-xs">
              {/* Form Thêm/Sửa */}
              <form onSubmit={handleSubmit} className="p-4 rounded-xl liquid-glass-control flex flex-col gap-3">
                <div className="font-semibold text-slate-800 dark:text-slate-200">
                  {editingCat ? `Đổi thông tin: ${editingCat.name}` : '+ Thêm danh mục mới'}
                </div>

                <div>
                  <label htmlFor="category-name-input" className="block text-slate-500 dark:text-slate-400 mb-1">Tên danh mục *</label>
                  <input
                    id="category-name-input"
                    type="text"
                    required
                    placeholder="Ví dụ: Tâm lý, Sáng tạo, Tài chính..."
                    value={name}
                    onChange={e => setName(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl liquid-glass-control text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:text-slate-400"
                  />
                </div>

                <div>
                  <label className="block text-slate-500 dark:text-slate-400 mb-1">Màu sắc đại diện</label>
                  <div className="flex items-center gap-1.5 flex-wrap" role="group" aria-label="Chọn màu sắc danh mục">
                    {presetColors.map(c => (
                      <button
                        key={c}
                        type="button"
                        aria-pressed={color === c}
                        aria-label={`Màu danh mục ${c}`}
                        onClick={() => setColor(c)}
                        className={`spring-pill w-6 h-6 rounded-lg ${
                          color === c ? 'ring-2 ring-white ring-offset-2 dark:ring-offset-[#111827] scale-110 shadow-sm' : ''
                        }`}
                        style={{ backgroundColor: c, boxShadow: color === c ? `0 4px 12px ${c}70` : 'none' }}
                      />
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-slate-500 dark:text-slate-400 mb-1">Biểu tượng</label>
                  <div className="grid grid-cols-6 gap-1.5" role="group" aria-label="Chọn biểu tượng danh mục">
                    {presetIcons.map(ic => (
                      <button
                        key={ic}
                        type="button"
                        aria-pressed={icon === ic}
                        aria-label={`Biểu tượng danh mục ${ic}`}
                        onClick={() => setIcon(ic)}
                        className={`spring-pill p-1.5 rounded-lg flex items-center justify-center ${
                          icon === ic
                            ? 'border border-indigo-500 bg-indigo-500/20 text-indigo-400 shadow-sm'
                            : 'liquid-glass-control text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'
                        }`}
                      >
                        <Icon name={ic} className="w-4 h-4" />
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 mt-1">
                  {editingCat && (
                    <button
                      type="button"
                      onClick={handleResetForm}
                      className="spring-button px-3 py-1.5 rounded-xl liquid-glass-control text-slate-600 dark:text-slate-300 hover:brightness-110"
                    >
                      Hủy sửa
                    </button>
                  )}
                  <LucianGlassButton
                    type="submit"
                    variant="primary"
                  >
                    {editingCat ? 'Cập nhật' : '+ Thêm danh mục'}
                  </LucianGlassButton>
                </div>
              </form>

              {/* Danh sách danh mục hiện có */}
              <section aria-label="Danh sách danh mục hiện có">
                <div className="font-semibold text-slate-400 uppercase tracking-wider mb-2">
                  Danh mục hiện có ({categories.length})
                </div>
                <div className="divide-y divide-slate-200/50 dark:divide-white/[0.08] rounded-xl overflow-hidden liquid-glass-control">
                  {categories.map(cat => {
                    const habitCount = (habits || []).filter(h => h.category === cat.name).length;
                    const isSystem = isDefaultCategory(cat);
                    return (
                      <div key={cat.id || cat.name} className="p-3 flex items-center justify-between hover:bg-slate-100/40 dark:hover:bg-white/[0.03] transition-colors">
                        <div className="flex items-center gap-2.5">
                          <div
                            className="w-7 h-7 rounded-lg flex items-center justify-center text-white flex-shrink-0 shadow-sm"
                            style={{ backgroundColor: cat.color, boxShadow: `0 3px 10px ${cat.color}50` }}
                            aria-hidden="true"
                          >
                            <Icon name={cat.icon} className="w-3.5 h-3.5" />
                          </div>
                          <div>
                            <div className="flex items-center gap-1.5">
                              <span className="font-semibold text-slate-800 dark:text-slate-100">
                                {cat.name}
                              </span>
                              {isSystem && (
                                <span className="px-1.5 py-0.5 text-[9px] font-bold uppercase rounded bg-slate-200/60 dark:bg-white/10 text-slate-500 dark:text-slate-400">
                                  Hệ thống
                                </span>
                              )}
                            </div>
                            <span className="font-mono text-[10px] text-slate-400">
                              ({habitCount} thói quen)
                            </span>
                          </div>
                        </div>

                        <div className="flex items-center gap-1">
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();
                              handleStartEdit(cat);
                            }}
                            className="spring-button p-1.5 rounded-lg text-slate-400 hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-white/[0.05]"
                            title={`Sửa danh mục "${cat.name}"`}
                            aria-label={`Sửa danh mục ${cat.name}`}
                          >
                            <Icon name="edit" className="w-3.5 h-3.5 pointer-events-none" />
                          </button>
                          {!isSystem && (
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                setDeletingCat(cat);
                              }}
                              className="spring-button p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-500/10 transition-colors"
                              title={`Xóa danh mục "${cat.name}"`}
                              aria-label={`Xóa danh mục ${cat.name}`}
                            >
                              <Icon name="trash" className="w-3.5 h-3.5 pointer-events-none" />
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            </div>

            <footer className="pt-3 border-t border-slate-200/50 dark:border-white/[0.08] flex justify-end">
              <button
                type="button"
                onClick={onClose}
                className="spring-button px-4 py-2 rounded-xl liquid-glass-control font-semibold text-slate-700 dark:text-slate-200 hover:brightness-110"
              >
                Đóng
              </button>
            </footer>

            {/* Modal xác nhận xóa danh mục */}
            {deletingCat && (
              <div className="animate-modal-backdrop fixed inset-0 z-[60] flex items-center justify-center p-4 liquid-glass-backdrop">
                <div
                  className="animate-modal-dialog w-full max-w-sm max-h-[90vh] overflow-y-auto p-6 rounded-2xl liquid-glass-modal shadow-2xl border border-white/20"
                  role="alertdialog"
                  aria-modal="true"
                  aria-labelledby="delete-cat-modal-title"
                >
                  <div className="flex items-center gap-3 mb-2">
                    <div className="w-9 h-9 rounded-xl bg-rose-500/15 text-rose-500 border border-rose-500/30 flex items-center justify-center shrink-0" aria-hidden="true">
                      <Icon name="trash" className="w-4 h-4" />
                    </div>
                    <div>
                      <h3 id="delete-cat-modal-title" className="text-base font-serif font-bold text-slate-900 dark:text-white tracking-wide">
                        Xác nhận xóa danh mục?
                      </h3>
                      <p className="text-xs text-slate-400">Thao tác yêu cầu xác nhận</p>
                    </div>
                  </div>

                  <p className="mt-2 text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                    Bạn có chắc chắn muốn xóa danh mục <strong className="text-slate-900 dark:text-white">"{deletingCat.name}"</strong>?
                  </p>

                  {(() => {
                    const count = (habits || []).filter(h => (h.category || '').trim().toLowerCase() === (deletingCat.name || '').trim().toLowerCase()).length;
                    if (count > 0) {
                      return (
                        <div className="mt-3 p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 text-xs flex items-start gap-2">
                          <Icon name="activity" className="w-4 h-4 shrink-0 mt-0.5" />
                          <span>
                            Danh mục này đang chứa <strong>{count} thói quen</strong>. Toàn bộ thói quen và lịch sử tích lũy sẽ được bảo toàn an toàn và chuyển sang <strong>Chưa phân loại</strong>.
                          </span>
                        </div>
                      );
                    }
                    return (
                      <p className="mt-2 text-xs text-slate-400">
                        Danh mục này hiện không chứa thói quen nào. Sau khi xóa, danh mục sẽ bị loại bỏ khỏi danh sách.
                      </p>
                    );
                  })()}

                  <div className="mt-5 flex items-center justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={() => setDeletingCat(null)}
                      className="spring-button px-3.5 py-1.5 rounded-xl liquid-glass-control text-xs font-semibold text-slate-700 dark:text-slate-300 hover:brightness-110"
                    >
                      Hủy
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        const target = deletingCat;
                        setDeletingCat(null);
                        onDeleteCategory(target);
                      }}
                      className="spring-button px-4 py-1.5 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white text-xs font-semibold shadow-lg shadow-rose-600/30 border border-white/20"
                    >
                      Xóa danh mục
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
