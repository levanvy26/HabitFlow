                                {d.label}
                              </text>

                              {/* Hover Rect for Tooltip */}
                              <rect
                                x={slotX}
                                y={padTop}
                                width={slotW}
                                height={chartH}
                                fill="transparent"
                                className="cursor-pointer"
                                onMouseEnter={(e) => {
                                  const container = e.currentTarget.closest('.chart-container-rel');
                                  let targetX = 100;
                                  if (container) {
                                    const parentRect = container.getBoundingClientRect();
                                    const rect = e.currentTarget.getBoundingClientRect();
                                    const cX = rect.left - parentRect.left + rect.width / 2;
                                    targetX = Math.max(8, Math.min(parentRect.width - 220, cX - 100));
                                  }
                                  setChartTooltip({
                                    title: `Ngày ${d.label} (${d.dateThis})`,
                                    line1: `Tuần này: ${d.isFuture ? 'Chưa diễn ra' : (d.doneThis ? 'Đã hoàn thành (1/1)' : 'Chưa hoàn thành (0/1)')}`,
                                    line2: `Tuần trước (${d.dateLast}): ${d.doneLast ? 'Đã hoàn thành (1/1)' : 'Chưa hoàn thành (0/1)'}`,
                                    delta: d.isFuture ? undefined : (d.doneThis === d.doneLast ? '0' : d.doneThis ? '+100' : '-100'),
                                    targetX,
                                    targetY: 8,
                                    slotIdx: i
                                  });
                                }}
                                onMouseLeave={() => setChartTooltip(null)}
                              />
                            </g>
                          );
                        })}

                        {/* Smooth Monotone Trend Lines */}
                        {splineLast.linePath && (
                          <path
                            d={splineLast.linePath}
                            fill="none"
                            stroke="#94A3B8"
                            strokeWidth="1.6"
                            strokeDasharray="4 3"
                            opacity="0.65"
                            strokeLinecap="round"
                          />
                        )}
                        {splineThis.linePath && (
                          <path
                            d={splineThis.linePath}
                            fill="none"
                            stroke={habitColor}
                            strokeWidth="2.4"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            filter="url(#hModalWeekGlow)"
                          />
                        )}

                        {/* Focused Point Markers on Hover */}
                        {chartTooltip?.slotIdx !== undefined && pointsThis[chartTooltip.slotIdx] && (
                          <g className="pointer-events-none transition-all duration-150">
                            {/* Subtle vertical guideline */}
                            <line
                              x1={pointsThis[chartTooltip.slotIdx].centerX}
                              y1={padTop}
                              x2={pointsThis[chartTooltip.slotIdx].centerX}
                              y2={baselineY}
                              stroke="currentColor"
                              strokeOpacity="0.18"
                              strokeDasharray="2 2"
                            />
                            {/* Last week marker */}
                            <circle
                              cx={pointsLast[chartTooltip.slotIdx].x}
                              cy={pointsLast[chartTooltip.slotIdx].y}
                              r="3"
                              fill="#94A3B8"
                              stroke="#FFFFFF"
                              strokeWidth="1.5"
                            />
                            {/* This week marker */}
                            <circle
                              cx={pointsThis[chartTooltip.slotIdx].x}
                              cy={pointsThis[chartTooltip.slotIdx].y}
                              r="6.5"
                              fill={habitColor}
                              fillOpacity="0.25"
                            />
                            <circle
                              cx={pointsThis[chartTooltip.slotIdx].x}
                              cy={pointsThis[chartTooltip.slotIdx].y}
                              r="3.5"
                              fill={habitColor}
                              stroke="#FFFFFF"
                              strokeWidth="2"
                            />
                          </g>
                        )}
                      </svg>
                      <LucianSlidingTooltip tooltip={chartTooltip} />
                    </div>
                  );
                })()}
              </ComparativeChartCard>

              {/* ========================================================== */}
              {/* CHART 2: SO SÁNH THÁNG (Tháng này vs Tháng trước)          */}
              {/* ========================================================== */}
              <ComparativeChartCard
                title="SO SÁNH THÁNG"
                subtitle={`T${monthAnalytics.thisMonthNum} vs T${monthAnalytics.prevMonthNum} (Lũy kế 31 ngày)`}
                deltaRate={monthAnalytics.deltaRate}
                legendLeftDotClass="bg-cyan-400"
                legendLeftTextClass="text-cyan-500"
                legendLeftLabel={`Tháng ${monthAnalytics.prevMonthNum} (${monthAnalytics.lastMonthElapsedActual}/${monthAnalytics.compareDaysMonth}d)`}
                habitColor={habitColor}
                legendRightLabel={`Tháng ${monthAnalytics.thisMonthNum} (${monthAnalytics.thisMonthActual}/${monthAnalytics.currentDayOfMonth}d)`}
                footerPrefix="Đối chiếu:"
                footerHighlight={`1-${monthAnalytics.currentDayOfMonth}/${monthAnalytics.thisMonthNum}`}
                deltaAbs={monthAnalytics.deltaAbs}
                deltaAbsPairText={`${monthAnalytics.thisMonthActual} vs ${monthAnalytics.lastMonthElapsedActual}`}
              >
                {/* SVG Dual Cumulative Area / Line Chart */}
                {(() => {
                  const svgW = 460;
                  const svgH = 220;
                  const padLeft = 34;
                  const padRight = 16;
                  const padTop = 22;
                  const padBottom = 28;
                  const chartW = svgW - padLeft - padRight;
                  const chartH = svgH - padTop - padBottom;
                  const maxDays = monthAnalytics.maxDays;
                  const stepX = chartW / (maxDays - 1);
                  const maxY = maxDays; // cumulative scale up to maxDays

                  const pointsLast = [];
                  const pointsThis = [];

                  monthAnalytics.days.forEach((d, i) => {
                    const x = padLeft + (d.day - 1) * stepX;
                    if (d.cumLast !== null) {
                      const yLast = padTop + chartH - (d.cumLast / maxY) * chartH;
                      pointsLast.push({ x, y: yLast, day: d.day, cum: d.cumLast });
                    }
                    if (d.cumThis !== null) {
                      const yThis = padTop + chartH - (d.cumThis / maxY) * chartH;
                      pointsThis.push({ x, y: yThis, day: d.day, cum: d.cumThis });
                    }
                  });

                  const baselineY = padTop + chartH;
                  const splineLast = buildMonotoneSplinePath(pointsLast);
                  const splineThis = buildMonotoneSplinePath(pointsThis, baselineY);
                  const lastThisPt = pointsThis[pointsThis.length - 1];

                  return (
                    <div className="relative chart-container-rel">
                      <svg
                        viewBox={`0 0 ${svgW} ${svgH}`}
                        className="w-full h-auto overflow-visible"
                        role="img"
                        aria-label={`Biểu đồ lũy kế tháng của thói quen ${habit.name}`}
                      >
                        <defs>
                          <linearGradient id="hGradMonthArea" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor={habitColor} stopOpacity="0.30" />
                            <stop offset="65%" stopColor={habitColor} stopOpacity="0.08" />
                            <stop offset="100%" stopColor={habitColor} stopOpacity="0.0" />
                          </linearGradient>
                          <linearGradient id="hGradMonthAreaLast" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.2" />
                            <stop offset="100%" stopColor="#06B6D4" stopOpacity="0.0" />
                          </linearGradient>
                          <filter id="hModalMonthGlow" x="-10%" y="-10%" width="120%" height="120%">
                            <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor={habitColor} floodOpacity="0.25" />
                          </filter>
                        </defs>

                        {/* Grid lines: 0, 10, 20, 30 days */}
                        {[0, 10, 20, 30].map(val => {
                          const y = padTop + chartH - (val / maxY) * chartH;
                          return (
                            <g key={val}>
                              <line
                                x1={padLeft}
                                y1={y}
                                x2={padLeft + chartW}
                                y2={y}
                                stroke="currentColor"
                                strokeOpacity="0.1"
                                strokeDasharray="3 3"
                              />
                              <text
                                x={padLeft - 6}
                                y={y + 3.5}
                                fontSize="9"
                                textAnchor="end"
                                fill="currentColor"
                                opacity="0.4"
                                fontFamily="JetBrains Mono"
                              >
                                {val}d
                              </text>
                            </g>
                          );
                        })}

                        {/* Smooth Gradient Area fill */}
                        {splineThis.areaPath && (
                          <path
                            d={splineThis.areaPath}
                            fill="url(#hGradMonthArea)"
                            className="pointer-events-none"
                          />
                        )}

                        {/* Last Month Cumulative Smooth Spline */}
                        {splineLast.linePath && (
                          <path
                            d={splineLast.linePath}
                            fill="none"
                            stroke="#06B6D4"
                            strokeWidth="1.8"
                            strokeDasharray="4 2.5"
                            strokeLinecap="round"
                            opacity="0.85"
                          />
                        )}

                        {/* This Month Cumulative Smooth Spline */}
                        {splineThis.linePath && (
                          <path
                            d={splineThis.linePath}
                            fill="none"
                            stroke={habitColor}
                            strokeWidth="2.4"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            filter="url(#hModalMonthGlow)"
                          />
                        )}

                        {/* Today Endpoint Pulse Marker */}
                        {lastThisPt && (
                          <g className="pointer-events-none">
                            <circle
                              cx={lastThisPt.x}
                              cy={lastThisPt.y}
                              r="4"
                              fill={habitColor}
                              stroke="#FFFFFF"
                              strokeWidth="2"
                            />
                            <circle
                              cx={lastThisPt.x}
                              cy={lastThisPt.y}
                              r="7"
                              fill="none"
                              stroke={habitColor}
                              strokeWidth="1"
                              opacity="0.5"
                            />
                          </g>
                        )}

                        {/* Day Axis ticks: 1, 5, 10, 15, 20, 25, 31 */}
                        {[1, 5, 10, 15, 20, 25, 31].filter(d => d <= maxDays).map(d => {
                          const x = padLeft + (d - 1) * stepX;
                          return (
                            <g key={d}>
                              <line x1={x} y1={baselineY} x2={x} y2={baselineY + 4} stroke="currentColor" opacity="0.3" />
                              <text
                                x={x}
                                y={baselineY + 14}
                                fontSize="9"
                                textAnchor="middle"
                                fill="currentColor"
                                opacity="0.5"
                                fontFamily="JetBrains Mono"
                              >
                                d{d}
                              </text>
                            </g>
                          );
                        })}

                        {/* Hover Overlay Columns */}
                        {monthAnalytics.days.map((d, i) => {
                          const x = padLeft + (d.day - 1) * stepX;
                          return (
                            <rect
                              key={i}
                              x={x - stepX / 2}
                              y={padTop}
                              width={stepX}
                              height={chartH}
                              fill="transparent"
                              className="cursor-pointer"
                              onMouseEnter={(e) => {
                                const container = e.currentTarget.closest('.chart-container-rel');
                                let targetX = 100;
                                if (container) {
                                  const parentRect = container.getBoundingClientRect();
                                  const rect = e.currentTarget.getBoundingClientRect();
                                  const cX = rect.left - parentRect.left + rect.width / 2;
                                  targetX = Math.max(8, Math.min(parentRect.width - 220, cX - 100));
                                }
                                setChartTooltip({
                                  title: `Ngày ${d.day} (${d.sThis || ''})`,
                                  line1: `Tháng ${monthAnalytics.thisMonthNum}: ${d.isFuture ? 'Chưa diễn ra' : `${d.cumThis} ngày (${d.doneThis ? 'Hoàn thành' : 'Chưa làm'})`}`,
                                  line2: `Tháng ${monthAnalytics.prevMonthNum}: ${d.cumLast !== null ? `${d.cumLast} ngày (${d.doneLast ? 'Hoàn thành' : 'Chưa làm'})` : 'Không có ngày này'}`,
                                  delta: (!d.isFuture && d.cumThis !== null && d.cumLast !== null) ? `${d.cumThis - d.cumLast >= 0 ? '+' : ''}${d.cumThis - d.cumLast}` : undefined,
                                  targetX,
                                  targetY: 8,
                                  slotIdx: i
                                });
                              }}
                              onMouseLeave={() => setChartTooltip(null)}
                            />
                          );
                        })}

                        {/* Focused Point Markers on Hover */}
                        {chartTooltip?.slotIdx !== undefined && (
                          <g className="pointer-events-none transition-all duration-150">
                            {/* Guideline */}
                            <line
                              x1={padLeft + chartTooltip.slotIdx * stepX}
                              y1={padTop}
                              x2={padLeft + chartTooltip.slotIdx * stepX}
                              y2={baselineY}
                              stroke="currentColor"
                              strokeOpacity="0.18"
                              strokeDasharray="2 2"
                            />
                            {pointsLast[chartTooltip.slotIdx] && (
                              <circle
                                cx={pointsLast[chartTooltip.slotIdx].x}
                                cy={pointsLast[chartTooltip.slotIdx].y}
                                r="3"
                                fill="#06B6D4"
                                stroke="#FFFFFF"
                                strokeWidth="1.5"
                              />
                            )}
                            {pointsThis[chartTooltip.slotIdx] && (
                              <g>
                                <circle
                                  cx={pointsThis[chartTooltip.slotIdx].x}
                                  cy={pointsThis[chartTooltip.slotIdx].y}
                                  r="6.5"
                                  fill={habitColor}
                                  fillOpacity="0.25"
                                />
                                <circle
                                  cx={pointsThis[chartTooltip.slotIdx].x}
                                  cy={pointsThis[chartTooltip.slotIdx].y}
                                  r="3.5"
                                  fill={habitColor}
                                  stroke="#FFFFFF"
                                  strokeWidth="2"
                                />
                              </g>
                            )}
                          </g>
                        )}
                      </svg>
                      <LucianSlidingTooltip tooltip={chartTooltip} />
                    </div>
                  );
                })()}
              </ComparativeChartCard>

              {/* ========================================================== */}
              {/* CHART 3: SO SÁNH NĂM (Năm này vs Năm trước)                */}
              {/* ========================================================== */}
              <ComparativeChartCard
                title="SO SÁNH NĂM"
                subtitle={`Năm ${yearAnalytics.currentYear} vs Năm ${yearAnalytics.prevYear} (12 tháng)`}
                deltaRate={yearAnalytics.deltaRate}
                legendLeftDotClass="bg-slate-400"
                legendLeftTextClass="text-slate-400"
                legendLeftLabel={`Năm ${yearAnalytics.prevYear} (${yearAnalytics.lastYearElapsedActual}/${yearAnalytics.dayOfYear}d)`}
                habitColor={habitColor}
                legendRightLabel={`Năm ${yearAnalytics.currentYear} (${yearAnalytics.thisYearActual}/${yearAnalytics.dayOfYear}d)`}
                footerPrefix="Lũy kế:"
                footerHighlight={`${yearAnalytics.dayOfYear} ngày`}
                deltaAbs={yearAnalytics.deltaAbs}
                deltaAbsPairText={`${yearAnalytics.thisYearActual} vs ${yearAnalytics.lastYearElapsedActual}`}
              >
                {/* SVG 12-Month Grouped Bar Chart */}
                {(() => {
                  const svgW = 460;
                  const svgH = 220;
                  const padLeft = 34;
                  const padRight = 16;
                  const padTop = 22;
                  const padBottom = 28;
                  const chartW = svgW - padLeft - padRight;
                  const chartH = svgH - padTop - padBottom;
                  const slotW = chartW / 12;

                    <div className="relative chart-container-rel">
                      <svg
                        viewBox={`0 0 ${svgW} ${svgH}`}
                        className="w-full h-auto overflow-visible"
                        role="img"
                        aria-label={`Biểu đồ so sánh 12 tháng theo năm của thói quen ${habit.name}`}
                      >
                        <defs>
                          <linearGradient id="hGradYearThis" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor={habitColor} stopOpacity="1" />
                            <stop offset="100%" stopColor={habitColor} stopOpacity="0.6" />
                          </linearGradient>
                          <linearGradient id="hGradYearLast" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#94A3B8" stopOpacity="0.8" />
                            <stop offset="100%" stopColor="#64748B" stopOpacity="0.4" />
                          </linearGradient>
                        </defs>

                        {/* Grid lines: 0%, 50%, 100% */}
                        {[0, 50, 100].map(pct => {
                          const y = padTop + chartH - (pct / 100) * chartH;
                          return (
                            <g key={pct}>
                              <line
                                x1={padLeft}
                                y1={y}
                                x2={padLeft + chartW}
                                y2={y}
                                stroke="currentColor"
                                strokeOpacity="0.1"
                                strokeDasharray="3 3"
                              />
                              <text
                                x={padLeft - 6}
                                y={y + 3.5}
                                fontSize="9"
                                textAnchor="end"
                                fill="currentColor"
                                opacity="0.4"
                                fontFamily="JetBrains Mono"
                              >
                                {pct}%
                              </text>
                            </g>
                          );
                        })}

                        {/* 12 Months Bars */}
                        {yearAnalytics.monthData.map((d, i) => {
                          const slotX = padLeft + i * slotW;
                          const centerX = slotX + slotW / 2;
                          const barW = 10;

                          const hLast = (d.rateLast / 100) * chartH;
                          const yLast = padTop + chartH - hLast;
                          const xLast = centerX - barW - 1;

                          const hThis = d.isFuture ? 0 : (d.rateThis / 100) * chartH;
                          const yThis = padTop + chartH - hThis;
                          const xThis = centerX + 1;

                          return (
                            <g key={i}>
                              {/* Last Year Bar */}
                              <rect
                                x={xLast}
                                y={yLast}
                                width={barW}
                                height={Math.max(2, hLast)}
                                rx="2"
                                fill="url(#hGradYearLast)"
                              />

                              {/* This Year Bar */}
                              {d.isFuture ? (
                                <rect
                                  x={xThis}
                                  y={padTop + chartH * 0.2}
                                  width={barW}
                                  height={chartH * 0.8}
                                  rx="2"
                                  fill="none"
                                  stroke="currentColor"
                                  strokeOpacity="0.2"
                                  strokeDasharray="2 2"
                                />
                              ) : (
                                <rect
                                  x={xThis}
                                  y={yThis}
                                  width={barW}
                                  height={Math.max(2, hThis)}
                                  rx="2"
                                  fill="url(#hGradYearThis)"
                                />
                              )}

                              {/* Month label */}
                              <text
                                x={centerX}
                                y={svgH - 10}
                                fontSize="9"
                                textAnchor="middle"
                                fill="currentColor"
                                fontWeight={d.isCurrent ? "bold" : "normal"}
                                opacity={d.isCurrent ? 1 : 0.6}
                                fontFamily="JetBrains Mono"
                              >
                                T{d.month}
                              </text>

                              {/* Hover Rect */}
                              <rect
                                x={slotX}
                                y={padTop}
                                width={slotW}
                                height={chartH}
                                fill="transparent"
                                className="cursor-pointer"
                                onMouseEnter={(e) => {
                                  const container = e.currentTarget.closest('.chart-container-rel');
                                  let targetX = 100;
                                  if (container) {
                                    const parentRect = container.getBoundingClientRect();
                                    const rect = e.currentTarget.getBoundingClientRect();
                                    const cX = rect.left - parentRect.left + rect.width / 2;
                                    targetX = Math.max(8, Math.min(parentRect.width - 220, cX - 100));
                                  }
                                  setChartTooltip({
                                    title: `Tháng ${d.month} (Năm ${yearAnalytics.currentYear} vs ${yearAnalytics.prevYear})`,
                                    line1: `Năm ${yearAnalytics.currentYear}: ${d.isFuture ? 'Chưa diễn ra' : `${d.countThis}/${d.activeDaysThis}d (${d.rateThis.toFixed(1)}%)`}`,
                                    line2: `Năm ${yearAnalytics.prevYear}: ${d.countLast}/${d.activeDaysLast}d (${d.rateLast.toFixed(1)}%)`,
                                    delta: !d.isFuture ? (d.rateThis - d.rateLast).toFixed(1) : undefined,
                                    targetX,
                                    targetY: 8
                                  });
                                }}
                                onMouseLeave={() => setChartTooltip(null)}
                              />
                            </g>

                      </svg>
                      <LucianSlidingTooltip tooltip={chartTooltip} />
                    </div>
                  );
                })()}
              </ComparativeChartCard>

            </div>

            >

                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center border border-indigo-500/20" aria-hidden="true">
                    <Icon name="trending-up" className="w-4 h-4 stroke-[2.2]" />
                  </div>
                  <div>
                    <h3 id="growth-summary-title" className="text-sm md:text-base font-serif font-bold uppercase tracking-wider text-slate-900 dark:text-white">
