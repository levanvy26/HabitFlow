                          <stop offset="60%" stopColor="#6366F1" stopOpacity="0.08" />
                          <stop offset="100%" stopColor="#6366F1" stopOpacity="0.0" />
                        </linearGradient>
                        <filter id="glowMonthB" x="-10%" y="-10%" width="120%" height="120%">
                          <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#6366F1" floodOpacity="0.25" />
                        </filter>
                      </defs>

                      {[0, 50, 100].map(pct => {
                        const y = padTop + chartH - (pct / 100) * chartH;
                        return (
                          <g key={pct}>
                            <line
                              x1={padLeft}
                              y1={y}
                              x2={padLeft + chartW}
                              y2={y}
                              stroke="currentColor"
                              strokeOpacity="0.1"
                            />
                            <text
                              x={padLeft - 6}
                              y={y + 3.5}
                              fontSize="9"
                              textAnchor="end"
                              fill="currentColor"
                              opacity="0.4"
                              fontFamily="JetBrains Mono"
                            >
                              {pct}%
                            </text>
                          </g>
                        );
                      })}

                      {splineA.areaPath && <path d={splineA.areaPath} fill="url(#gradAreaA)" className="pointer-events-none" />}
                      {splineB.areaPath && <path d={splineB.areaPath} fill="url(#gradAreaB)" className="pointer-events-none" />}

                      {splineA.linePath && (
                        <path
                          d={splineA.linePath}
                          fill="none"
                          stroke="#06B6D4"
                          strokeWidth="1.8"
                          strokeDasharray="4 2.5"
                          strokeLinecap="round"
                          opacity="0.85"
                        />
                      )}
                      {splineB.linePath && (
                        <path
                          d={splineB.linePath}
                          fill="none"
                          stroke="#6366F1"
                          strokeWidth="2.4"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          filter="url(#glowMonthB)"
                        />
                      )}

                      {[1, 5, 10, 15, 20, 25, 31].map(d => {
                        const x = padLeft + (d - 1) * stepX;
                        return (
                          <g key={d}>
                            <line x1={x} y1={baselineY} x2={x} y2={baselineY + 4} stroke="currentColor" opacity="0.3" />
                            <text
                              x={x}
                              y={baselineY + 14}
                              fontSize="9"
                              textAnchor="middle"
                              fill="currentColor"
                              opacity="0.5"
                              fontFamily="JetBrains Mono"
                            >
                              d{d}
                            </text>
                          </g>
                        );
                      })}

                      {monthData.map((d, i) => (
                        <rect
                          key={i}
                          x={d.x - stepX / 2}
                          y={padTop}
                          width={stepX}
                          height={chartH}
                          fill="transparent"
                          className="cursor-pointer"
                          onMouseEnter={(e) => {
                            const container = e.currentTarget.closest('.chart-container-rel');
                            let targetX = 100;
                            if (container) {
                              const parentRect = container.getBoundingClientRect();
                              const rect = e.currentTarget.getBoundingClientRect();
                              const cX = rect.left - parentRect.left + rect.width / 2;
                              targetX = Math.max(8, Math.min(parentRect.width - 220, cX - 100));
                            }
                            setChartTooltip({
                              title: `Ngày ${d.day}`,
                              line1: `Tháng B (T${compareMonthB.month + 1}): ${d.pctB.toFixed(0)}%`,
                              line2: `Tháng A (T${compareMonthA.month + 1}): ${d.pctA.toFixed(0)}%`,
                              delta: (d.pctB - d.pctA).toFixed(1),
                              targetX,
                              targetY: 8,
                              slotIdx: i
                            });
                          }}
                          onMouseLeave={() => setChartTooltip(null)}
                        />
                      ))}

                      {chartTooltip?.slotIdx !== undefined && pointsB[chartTooltip.slotIdx] && (
                        <g className="pointer-events-none transition-all duration-150">
                          <line
                            x1={monthData[chartTooltip.slotIdx].x}
                            y1={padTop}
                            x2={monthData[chartTooltip.slotIdx].x}
                            y2={baselineY}
                            stroke="currentColor"
                            strokeOpacity="0.18"
                            strokeDasharray="2 2"
                          />
                          <circle
                            cx={pointsA[chartTooltip.slotIdx].x}
                            cy={pointsA[chartTooltip.slotIdx].y}
                            r="3"
                            fill="#06B6D4"
                            stroke="#FFFFFF"
                            strokeWidth="1.5"
                          />
                          <circle
                            cx={pointsB[chartTooltip.slotIdx].x}
                            cy={pointsB[chartTooltip.slotIdx].y}
                            r="6.5"
                            fill="#6366F1"
                            fillOpacity="0.25"
                          />
                          <circle
                            cx={pointsB[chartTooltip.slotIdx].x}
                            cy={pointsB[chartTooltip.slotIdx].y}
                            r="3.5"
                            fill="#6366F1"
                            stroke="#FFFFFF"
                            strokeWidth="2"
                          />
                        </g>
                      )}
                    </svg>

                    <LucianSlidingTooltip tooltip={chartTooltip} />
                  </div>
                );
              })()}

              {/* Habit Growth Progress Bars between the 2 months */}
              <div className="mt-2 pt-3 border-t border-slate-200/50 dark:border-white/[0.08]">
                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                  Tăng trưởng từng thói quen (Tháng B vs A)
                </div>
                <div className="flex flex-col gap-2.5 text-xs">
                  {(data.habits || []).map(h => {
                    const daysInA = getDaysInMonth(compareMonthA.year, compareMonthA.month);
                    const daysInB = getDaysInMonth(compareMonthB.year, compareMonthB.month);

                    let countA = 0;
                    for (let d = 1; d <= daysInA; d++) {
                      const s = `${compareMonthA.year}-${String(compareMonthA.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                      if (isLogCompleted(data.logs[s]?.[h.id])) countA++;
                    }
                    const pctA = (countA / daysInA) * 100;

                    let countB = 0;
                    for (let d = 1; d <= daysInB; d++) {
                      const s = `${compareMonthB.year}-${String(compareMonthB.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                      if (isLogCompleted(data.logs[s]?.[h.id])) countB++;
                    }
                    const pctB = (countB / daysInB) * 100;
                    const delta = pctB - pctA;

                    return (
                      <div key={h.id} className="flex flex-col gap-1">
                        <div className="flex items-center justify-between">
                          <span className="font-medium text-slate-700 dark:text-slate-200 truncate max-w-[180px]">
                            {h.name}
                          </span>
                          <span className={`font-mono text-[11px] font-bold ${delta >= 0 ? 'text-emerald-500' : 'text-rose-500'}`}>
                            {delta >= 0 ? '+' : ''}{delta.toFixed(1)}% ({pctB.toFixed(0)}% vs {pctA.toFixed(0)}%)
                          </span>
                        </div>
                        <div className="w-full h-1.5 bg-slate-200/70 dark:bg-white/[0.08] backdrop-blur-sm rounded-full overflow-hidden flex">
                          <div
                            className="h-full rounded-full transition-all"
                            style={{ width: `${pctB}%`, backgroundColor: h.color }}
                          ></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>
          )}

          {/* TAB 3: SO SÁNH ĐA NĂM & 12 THÁNG (MULTI-YEAR COMPARATIVE ANALYTICS) */}
          {analyticsTab === 'year' && (
            <div key="tab-year" className="animate-tab-content mt-4 flex flex-col gap-4">
              {/* Multi-Year Selector Header */}
              <div className="flex flex-col gap-2.5 p-3 rounded-xl liquid-glass-control">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-semibold text-slate-700 dark:text-slate-300">
                    Chọn các năm so sánh:
                  </span>
                  <span className="text-[11px] font-mono text-slate-400">
                    Đã chọn: {selectedYears.length} năm
                  </span>
                </div>

                {/* Year Selector Pills */}
                <div className="flex items-center gap-1.5 flex-wrap" role="group" aria-label="Chọn năm đối chiếu">
                  {availableYears.map((yr, idx) => {
                    const isSelected = selectedYears.includes(yr);
                    const yrColor = getYearColor(yr, idx);
                    return (
                      <button
                        key={yr}
                        type="button"
                        aria-pressed={isSelected}
                        aria-label={`Chọn năm ${yr} để so sánh`}
                        onClick={() => {
                          if (isSelected) {
                            if (selectedYears.length > 1) {
                              setSelectedYears(selectedYears.filter(y => y !== yr));
                            } else {
                              showToast('Cần giữ ít nhất 1 năm để hiển thị', 'info');
                            }
                          } else {
                            setSelectedYears([...selectedYears, yr].sort((a, b) => a - b));
                          }
                        }}
                        className={`spring-pill flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-mono font-semibold border ${
                          isSelected
                            ? 'shadow-sm'
                            : 'liquid-glass-control text-slate-500 opacity-70 hover:opacity-100'
                        }`}
                        style={
                          isSelected
                            ? {
                                backgroundColor: `${yrColor}15`,
                                borderColor: yrColor,
                                color: yrColor
                              }
                            : {}
                        }
                      >
                        <span
                          className="w-2.5 h-2.5 rounded-full"
                          style={{ backgroundColor: isSelected ? yrColor : '#94A3B8' }}
                          aria-hidden="true"
                        ></span>
                        <span>Năm {yr}</span>
                        <span className="text-[10px] ml-0.5" aria-hidden="true">
                          {isSelected ? '✓' : '+'}
                        </span>
                      </button>
                    );
                  })}
                </div>

                {/* Legend Bar */}
                <div className="flex items-center gap-3 pt-2 border-t border-slate-200/60 dark:border-slate-700/60 flex-wrap text-[11px] font-mono">
                  {selectedYears.map((yr, idx) => {
                    const yrColor = getYearColor(yr, idx);
                    return (
                      <div key={yr} className="flex items-center gap-1.5">
                        <span className="w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: yrColor }} aria-hidden="true"></span>
                        <span style={{ color: yrColor }} className="font-semibold">Năm {yr}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* SVG 12-Month Multi-Series Grouped Bar Chart */}
              {(() => {
                const habits = data.habits || [];
                const logs = data.logs || {};
                const totalH = habits.length;
                const N = selectedYears.length;

                const months = Array.from({ length: 12 }, (_, i) => i);
                const monthData = months.map(m => {
                  const yrRates = selectedYears.map((yr, yIdx) => {
                    const daysInMonth = getDaysInMonth(yr, m);
                    const isCurrentYear = yr === new Date().getFullYear();
                    const currentM = new Date().getMonth();
                    const currentD = new Date().getDate();

                    let actualDays = daysInMonth;
                    if (isCurrentYear) {
                      if (m === currentM) {
                        actualDays = currentD;
                      } else if (m > currentM) {
                        actualDays = 0;
                      }
                    }

                    let completedCount = 0;
                    if (actualDays > 0) {
                      for (let d = 1; d <= actualDays; d++) {
                        const s = `${yr}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        for (const h of habits) {
                          if (isLogCompleted(logs[s]?.[h.id])) completedCount++;
                        }
                      }
                    }

                    const possibleCount = totalH * actualDays;
                    const pct = possibleCount > 0 ? (completedCount / possibleCount) * 100 : 0;

                    return {
                      year: yr,
                      color: getYearColor(yr, yIdx),
                      pct,
                      completedCount,
                      possibleCount,
                      isFuture: actualDays === 0
                    };
                  });

                  return {
                    month: m + 1,
                    yrRates
                  };
                });

                const svgW = 460;
                const svgH = 220;
                const padLeft = 32;
                const padRight = 16;
                const padTop = 20;
                const padBottom = 30;
                const chartW = svgW - padLeft - padRight;
                const chartH = svgH - padTop - padBottom;
                const slotW = chartW / 12;

                const gap = 1.5;
                const availableBarGroupWidth = slotW * 0.78;
                const barW = Math.max(3, Math.min(10, (availableBarGroupWidth - (N - 1) * gap) / N));
                const totalGroupWidth = N * barW + (N - 1) * gap;

                return (
                  <div className="relative chart-container-rel">
                    <svg
                      viewBox={`0 0 ${svgW} ${svgH}`}
                      className="w-full h-auto overflow-visible"
                      role="img"
                      aria-label="Biểu đồ cột 12 tháng đối chiếu tỷ lệ hoàn thành đa năm"
                    >
                      {[0, 50, 100].map(pct => {
                        const y = padTop + chartH - (pct / 100) * chartH;
                        return (
                          <g key={pct}>
                            <line
                              x1={padLeft}
                              y1={y}
                              x2={padLeft + chartW}
                              y2={y}
                              stroke="currentColor"
                              strokeOpacity="0.1"
                              strokeDasharray="3 3"
                            />
                            <text
                              x={padLeft - 6}
                              y={y + 3.5}
                              fontSize="9"
                              textAnchor="end"
                              fill="currentColor"
                              opacity="0.4"
                              fontFamily="JetBrains Mono"
                            >
                              {pct}%
                            </text>
                          </g>
                        );
                      })}

                      {monthData.map((d, i) => {
                        const slotX = padLeft + i * slotW;
                        const centerX = slotX + slotW / 2;
                        const groupStartX = centerX - totalGroupWidth / 2;

                        return (
                          <g key={i}>
                            {d.yrRates.map((yrData, yIdx) => {
                              const barX = groupStartX + yIdx * (barW + gap);
                              const barH = (yrData.pct / 100) * chartH;
                              const barY = padTop + chartH - barH;

                              return (
                                <rect
                                  key={yrData.year}
                                  x={barX}
                                  y={barY}
                                  width={barW}
                                  height={barH}
                                  rx={Math.min(2, barW / 2)}
                                  fill={yrData.color}
                                  opacity={yrData.isFuture ? 0.2 : 0.9}
                                />
                              );
                            })}

                            <text
                              x={centerX}
                              y={svgH - 10}
                              fontSize="9"
                              textAnchor="middle"
                              fill="currentColor"
                              opacity="0.6"
                              fontFamily="JetBrains Mono"
                            >
                              T{d.month}
                            </text>

                            <rect
                              x={slotX}
                              y={padTop}
                              width={slotW}
                              height={chartH}
                              fill="transparent"
                              className="cursor-pointer"
                              onMouseEnter={(e) => {
                                const container = e.currentTarget.closest('.chart-container-rel');
                                let targetX = 100;
                                if (container) {
                                  const parentRect = container.getBoundingClientRect();
                                  const rect = e.currentTarget.getBoundingClientRect();
                                  const centerX = rect.left - parentRect.left + rect.width / 2;
                                  targetX = Math.max(8, Math.min(parentRect.width - 220, centerX - 100));
                                }
                                const sortedByPct = [...d.yrRates].sort((a, b) => b.pct - a.pct);
                                const bestInMonth = sortedByPct[0];
                                setChartTooltip({
                                  title: `Tháng ${d.month} (Đối chiếu ${N} năm)`,
                                  rates: d.yrRates,
                                  bestText: `Năm cao nhất: ${bestInMonth.year} (${bestInMonth.pct.toFixed(1)}%)`,
                                  targetX,
                                  targetY: 8
                                });
                              }}
                              onMouseLeave={() => setChartTooltip(null)}
                            />
                          </g>
                        );
                      })}
                    </svg>

                    <LucianSlidingTooltip tooltip={chartTooltip} />
                  </div>
                );
              })()}

              {/* Long-Term Trend Summary & Peak Year */}
              {(() => {
                const habits = data.habits || [];
                const logs = data.logs || {};
                const totalH = habits.length;

                const yearStats = selectedYears.map((yr, idx) => {
                  const isCurrentYear = yr === new Date().getFullYear();
                  const currentM = new Date().getMonth();
                  const currentD = new Date().getDate();

                  let totalCompleted = 0;
                  let totalPossible = 0;
                  let bestMonth = 1;
                  let bestMonthRate = -1;

                  for (let m = 0; m < 12; m++) {
                    const daysInMonth = getDaysInMonth(yr, m);
                    let actualDays = daysInMonth;
                    if (isCurrentYear) {
                      if (m === currentM) actualDays = currentD;
                      else if (m > currentM) actualDays = 0;
                    }

                    if (actualDays > 0) {
                      let mCompleted = 0;
                      for (let d = 1; d <= actualDays; d++) {
                        const s = `${yr}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        for (const h of habits) {
                          if (isLogCompleted(logs[s]?.[h.id])) mCompleted++;
                        }
                      }
                      const mPossible = totalH * actualDays;
                      const mRate = mPossible > 0 ? (mCompleted / mPossible) * 100 : 0;
                      if (mRate > bestMonthRate) {
                        bestMonthRate = mRate;
                        bestMonth = m + 1;
                      }
                      totalCompleted += mCompleted;
                      totalPossible += mPossible;
                    }
                  }

                  const overallRate = totalPossible > 0 ? (totalCompleted / totalPossible) * 100 : 0;
                  return {
                    year: yr,
                    color: getYearColor(yr, idx),
                    rate: overallRate,
                    totalCompleted,
                    bestMonth,
                    bestMonthRate
                  };
                });

                const sortedByRate = [...yearStats].sort((a, b) => b.rate - a.rate);
                const peakYearObj = sortedByRate[0];

                return (
                  <div className="mt-2 pt-3 border-t border-slate-200/50 dark:border-white/[0.08] flex flex-col gap-3">
                    {peakYearObj && (
                      <div className="flex items-center justify-between p-3 rounded-xl bg-gradient-to-r from-amber-500/15 via-indigo-500/15 to-emerald-500/15 border border-amber-500/30 backdrop-blur-md text-xs shadow-sm">
                        <div className="flex items-center gap-2">
                          <span className="text-lg" aria-hidden="true">🏆</span>
                          <div>
                            <span className="font-bold text-slate-800 dark:text-slate-100">
                              Năm Phong Độ Đỉnh Cao: Năm {peakYearObj.year}
                            </span>
                            <div className="text-[11px] text-slate-500 dark:text-slate-400">
                              Tỷ lệ hoàn thành trung bình vượt trội: <strong className="text-amber-500 font-mono">{peakYearObj.rate.toFixed(1)}%</strong>
                            </div>
                          </div>
                        </div>
                        <span className="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-500 font-mono font-bold text-xs border border-amber-500/30">
                          Kỷ lục dài hạn
                        </span>
                      </div>
                    )}

                    <div className={`grid gap-2.5 ${selectedYears.length <= 2 ? 'grid-cols-2' : 'grid-cols-3'}`}>
                      {yearStats.map((ys, i) => {
                        const prevYs = i > 0 ? yearStats[i - 1] : null;
                        const growth = prevYs ? ys.rate - prevYs.rate : null;

                        return (
                          <article
                            key={ys.year}
                            className="spring-card p-3 rounded-xl liquid-glass-control flex flex-col gap-1.5"
                          >
                            <div className="flex items-center justify-between">
                              <span className="flex items-center gap-1.5 font-bold font-mono text-xs" style={{ color: ys.color }}>
                                <span className="w-2 h-2 rounded-full" style={{ backgroundColor: ys.color }} aria-hidden="true"></span>
                                Năm {ys.year}
                              </span>
                              {growth !== null && (
                                <span className={`text-[10px] font-mono font-bold ${growth >= 0 ? 'text-emerald-500' : 'text-rose-500'}`}>
                                  {growth >= 0 ? '↑ +' : '↓ '}{growth.toFixed(1)}%
                                </span>
                              )}
                            </div>

                            <div className="text-lg font-bold font-mono text-slate-800 dark:text-slate-100">
                              {ys.rate.toFixed(1)}%
                            </div>

                            <div className="text-[10px] text-slate-400">
                              Đỉnh: Tháng {ys.bestMonth} ({ys.bestMonthRate.toFixed(1)}%)
                            </div>
                          </article>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}

            </div>
          )}

          {/* FOCUS TIMER & NUMERIC TRACKING CATEGORY ALLOCATION SUMMARY */}
          {(() => {
            const totalFocusMins = computeTotalFocusMinutes(data.logs);
            const todayFocusMins = computeTotalFocusMinutes(data.logs, { dateStr: todayStr });
            const catAlloc = computeCategoryFocusAllocation(data.habits, data.logs, data.categories);
            const activeAlloc = catAlloc.filter(c => c.focusMinutes > 0);

            if (totalFocusMins <= 0 && todayFocusMins <= 0) return null;

            return (
              <div className="mt-4 pt-4 border-t border-slate-200/60 dark:border-white/10 flex flex-col gap-2.5 text-xs">
                <div className="flex items-center justify-between">
                  <span className="font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <Icon name="clock" className="w-3.5 h-3.5 text-emerald-500" />
                    <span>Phân Bổ Thời Gian Tập Trung (FT)</span>
                  </span>
                  <div className="flex items-center gap-2 font-mono text-[11px]">
                    <span className="text-emerald-500 font-bold">Hôm nay: {formatFocusDuration(todayFocusMins)}</span>
                    <span className="text-slate-400">• Tổng: {formatFocusDuration(totalFocusMins)}</span>
                  </div>
                </div>
                {activeAlloc.length > 0 && (
                  <div className="flex flex-col gap-1.5">
                    <div className="w-full h-2 rounded-full bg-slate-200/70 dark:bg-white/10 overflow-hidden flex">
                      {activeAlloc.map(item => (
                        <div
                          key={item.category}
                          style={{ width: `${item.percentage}%`, backgroundColor: item.color }}
                          title={`${item.category}: ${formatFocusDuration(item.focusMinutes)} (${item.percentage}%)`}
                          className="h-full transition-all duration-300"
                        />
                      ))}
                    </div>
                    <div className="flex items-center flex-wrap gap-3 pt-0.5 text-[11px] font-mono">
                      {activeAlloc.map(item => (
                        <span key={item.category} className="inline-flex items-center gap-1 text-slate-600 dark:text-slate-300">
                          <span className="w-2 h-2 rounded-full" style={{ backgroundColor: item.color }} />
                          <span>{item.category}:</span>
                          <strong>{formatFocusDuration(item.focusMinutes)}</strong>
                          <span className="text-slate-400">({item.percentage}%)</span>
                        </span>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );
          })()}

        </PhysicsCard>
      );
    }

    function App() {
      // Default initial categories
      const DEFAULT_CATEGORIES = [
        { id: 'cat-1', name: 'Học tập', color: '#6366F1', icon: 'book-open', isDefault: true },
        { id: 'cat-2', name: 'Kỹ thuật', color: '#F59E0B', icon: 'code', isDefault: true },
        { id: 'cat-3', name: 'Thể thao', color: '#10B981', icon: 'activity', isDefault: true },
        { id: 'cat-4', name: 'Sức khỏe', color: '#F43F5E', icon: 'heart', isDefault: true }
      ];

      // Local state
      const [todayStr, setTodayStr] = useState(formatLocalDate(new Date()));
      const [data, setData] = useState({
        settings: { theme: 'dark' },
        categories: DEFAULT_CATEGORIES,
        habits: [],
        logs: {}
      });
      const [theme, setTheme] = useState('dark');
      const [saveStatus, setSaveStatus] = useState('ready'); // 'ready' | 'saving' | 'saved'
      const [toast, setToast] = useState(null);

      // Filter & Navigation states
      const [activeCategory, setActiveCategory] = useState('Tất cả');
      const [selectedMonday, setSelectedMonday] = useState(() => getMonday(new Date()));
      const [selectedMonth, setSelectedMonth] = useState(() => ({
        year: new Date().getFullYear(),
        month: new Date().getMonth()
      }));
      const [heatmapHabitFilter, setHeatmapHabitFilter] = useState('all');

      // Analytics Tab State: 'week' | 'month' | 'year'
      const [analyticsTab, setAnalyticsTab] = useState('week');

      // Month Comparison Selection
      const [compareMonthA, setCompareMonthA] = useState(() => {
        const d = new Date();
        d.setMonth(d.getMonth() - 1);
        return { year: d.getFullYear(), month: d.getMonth() };
      });
      const [compareMonthB, setCompareMonthB] = useState(() => {
        const d = new Date();
        return { year: d.getFullYear(), month: d.getMonth() };
      });

      // Multi-Year Comparison Selection
      const [selectedYears, setSelectedYears] = useState([2024, 2025, 2026]);

      // Available years in dataset
      const availableYears = useMemo(() => {
        const yearsSet = new Set([2024, 2025, 2026]);
        for (const dateStr of Object.keys(data.logs || {})) {
          const y = parseInt(dateStr.split('-')[0], 10);
          if (!isNaN(y)) yearsSet.add(y);
        }
        return Array.from(yearsSet).sort((a, b) => a - b);
      }, [data.logs]);

      const getYearColor = (year, idx) => {
        const map = {
          2024: '#06B6D4', // Cyan
          2025: '#F59E0B', // Amber
          2026: '#6366F1', // Indigo
          2027: '#10B981', // Emerald
          2028: '#EC4899'  // Pink
        };
        const palette = ['#06B6D4', '#F59E0B', '#6366F1', '#10B981', '#EC4899', '#8B5CF6'];
        return map[year] || palette[idx % palette.length];
      };

      // Modal states
      const [habitModalOpen, setHabitModalOpen] = useState(false);
      const [editingHabit, setEditingHabit] = useState(null);
      const [deleteModalOpen, setDeleteModalOpen] = useState(false);
      const [habitToDelete, setHabitToDelete] = useState(null);
      const [categoryModalOpen, setCategoryModalOpen] = useState(false);
      const [focusingHabit, setFocusingHabit] = useState(null);

      // 5-Second Hover Habit Analytics States & Timer Refs (R2 Leak-Free Timers)
      const [analyzingHabit, setAnalyzingHabit] = useState(null);
      const [hoveringHabitId, setHoveringHabitId] = useState(null);
      const hoverTimerRef = useRef(null);
      const currentHoverHabitRef = useRef(null);
      const saveTimerRef = useRef(null);
      const toastTimerRef = useRef(null);

      const handleHabitMouseEnter = useCallback((habit) => {
        if (!habit || !habit.id) return;
        // If already tracking this exact habit, keep the timer running, don't restart
        if (currentHoverHabitRef.current?.id === habit.id && hoverTimerRef.current) {
          return;
        }

        // Cancel previous timer if any
        if (hoverTimerRef.current) {
          clearTimeout(hoverTimerRef.current);
          hoverTimerRef.current = null;
        }

        currentHoverHabitRef.current = habit;
        setHoveringHabitId(habit.id);

        hoverTimerRef.current = setTimeout(() => {
          setAnalyzingHabit(habit);
          setHoveringHabitId(null);
          hoverTimerRef.current = null;
          currentHoverHabitRef.current = null;
        }, 5000);
      }, []);

      const handleHabitMouseLeave = useCallback((habit) => {
        if (!habit || !habit.id) return;
        if (currentHoverHabitRef.current?.id === habit.id) {
          if (hoverTimerRef.current) {
            clearTimeout(hoverTimerRef.current);
            hoverTimerRef.current = null;
          }
          currentHoverHabitRef.current = null;
          setHoveringHabitId(null);
        }
      }, []);

      useEffect(() => {
        return () => {
          if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
          if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        };
      }, []);

      // Tooltip State for interactive charts
      const [chartTooltip, setChartTooltip] = useState(null);

      // Load initial data from Python API
      useEffect(() => {
        let loaded = false;
        const fetchInitialData = async () => {
          if (loaded) return;
          try {
            if (window.pywebview && window.pywebview.api && window.pywebview.api.load_data) {
              const res = await window.pywebview.api.load_data();
              if (res && res.habits) {
                if (!res.categories || res.categories.length === 0) {
                  res.categories = DEFAULT_CATEGORIES;
                }
                setData(res);
                if (res.settings && res.settings.theme) {
                  setTheme(res.settings.theme);
                }
              }
              const sysDate = await window.pywebview.api.get_system_date();
              if (sysDate) setTodayStr(sysDate);
              loaded = true;
            }
          } catch (err) {
            console.error("Lỗi khi tải dữ liệu:", err);
          }
        };

        fetchInitialData();
        window.addEventListener('pywebviewready', fetchInitialData);
        const timer = setInterval(() => {
          if (loaded) {
            clearInterval(timer);
          } else {
            fetchInitialData();
          }
        }, 100);

        return () => {
          window.removeEventListener('pywebviewready', fetchInitialData);
          clearInterval(timer);
        };
      }, []);

      // Zoom State (75% to 140% - keeps all cards filling the screen richly)
      const [zoom, setZoom] = useState(1);
      const [windowWidth, setWindowWidth] = useState(window.innerWidth || 1400);

      useEffect(() => {
        const handleResize = () => setWindowWidth(window.innerWidth);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // Calculate effective viewport width in CSS pixels to intelligently adapt layout under zoom
      const effectiveWidth = windowWidth / zoom;
      const isStackedLayout = effectiveWidth < 1240;

      // Apply native CSS zoom to document.documentElement for clean, responsive reflow and accurate fixed overlays
      useEffect(() => {
        document.documentElement.style.zoom = zoom;
        document.body.style.zoom = '';
      }, [zoom]);

      // Ctrl + Wheel Zoom In / Out & Key shortcuts
      useEffect(() => {
        const handleWheel = (e) => {
          if (e.ctrlKey) {
            e.preventDefault();
            setZoom(prev => {
              // deltaY < 0: cuộn lên -> tăng 5% (tối đa 140%)
              // deltaY > 0: cuộn xuống -> giảm 5% (tối thiểu 75%)
              const delta = e.deltaY < 0 ? 0.05 : -0.05;
              const nextZoom = Math.round((prev + delta) * 100) / 100;
              return Math.min(1.40, Math.max(0.75, nextZoom));
            });
          }
        };

        const handleKeyDown = (e) => {
          if (e.ctrlKey && (e.key === '0' || e.key === 'NumPad0')) {
            e.preventDefault();
            setZoom(1);
          } else if (e.ctrlKey && (e.key === '=' || e.key === '+')) {
            e.preventDefault();
            setZoom(prev => Math.min(1.40, Math.round((prev + 0.05) * 100) / 100));
          } else if (e.ctrlKey && (e.key === '-' || e.key === '_')) {
            e.preventDefault();
            setZoom(prev => Math.max(0.75, Math.round((prev - 0.05) * 100) / 100));
          }
        };

        window.addEventListener('wheel', handleWheel, { passive: false });
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('wheel', handleWheel);
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      // Synchronize theme & data-theme attribute with <html> and <body> (R2 Single Source of Truth)
      useEffect(() => {
        const root = document.documentElement;
        root.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          root.classList.add('dark');
          document.body.className = "liquid-mesh-dark text-[#F3F4F6] font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white";
        } else {
          root.classList.remove('dark');
          document.body.className = "liquid-mesh-light text-[#0F172A] font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white";
        }
      }, [theme]);

      // Direct write down to Python habit_data.json with leak-free status timer (R2)
      const persistData = useCallback(async (updatedData) => {
        if (saveTimerRef.current) {
          clearTimeout(saveTimerRef.current);
          saveTimerRef.current = null;
        }
        setSaveStatus('saving');
        try {
          if (window.pywebview && window.pywebview.api) {
            await window.pywebview.api.save_data(updatedData);
          }
          setSaveStatus('saved');
          saveTimerRef.current = setTimeout(() => {
            setSaveStatus('ready');
            saveTimerRef.current = null;
          }, 1500);
        } catch (err) {
          console.error("Lỗi khi ghi dữ liệu:", err);
          setSaveStatus('ready');
        }
      }, []);

      const showToast = useCallback((message, type = 'success') => {
        if (toastTimerRef.current) {
          clearTimeout(toastTimerRef.current);
          toastTimerRef.current = null;
        }
        setToast({ message, type });
        toastTimerRef.current = setTimeout(() => {
          setToast(null);
          toastTimerRef.current = null;
        }, 3000);
      }, []);

      // Pure state transition helper: keeps setData pure and executes persistData outside updater (R2)
      const dataRef = useRef(data);
      dataRef.current = data;

      const commitDataUpdate = useCallback((updater) => {
        const prev = dataRef.current;
        const next = typeof updater === 'function' ? updater(prev) : updater;
        if (!next || next === prev) return prev;
        dataRef.current = next;
        setData(next);
        persistData(next);
        return next;
      }, [persistData]);

      // Toggle Habit completion on a specific date while preserving Focus Timer sessions
      const toggleHabit = useCallback((habitId, dateStr) => {
        commitDataUpdate(prev => ({
          ...prev,
          logs: toggleHabitLogEntry(prev.logs, dateStr, habitId)
        }));
      }, [commitDataUpdate]);

      // Save Focus Timer session & auto-complete if targetMinutes is reached
      const handleSaveFocusSession = useCallback((habit, sessionPayload, targetDateStr = todayStr) => {
        if (!habit || !habit.id) return;
        let wasAutoCompleted = false;
        commitDataUpdate(prev => {
          const beforeCompleted = isLogCompleted(prev.logs?.[targetDateStr]?.[habit.id]);
          const nextLogs = recordFocusSession(prev.logs, targetDateStr, habit, sessionPayload);
          const afterCompleted = isLogCompleted(nextLogs?.[targetDateStr]?.[habit.id]);
          if (!beforeCompleted && afterCompleted) {
            wasAutoCompleted = true;
          }
          return {
            ...prev,
            logs: nextLogs
          };
        });
        if (wasAutoCompleted) {
          showToast(`Đã lưu phiên tập trung & tự động hoàn thành "${habit.name}"!`, 'success');
        } else {
          showToast(`Đã ghi nhận +${formatFocusDuration(sessionPayload?.duration || 0)} cho "${habit.name}"`, 'success');
        }
      }, [commitDataUpdate, todayStr, showToast]);

      // Theme Switch (DOM class & data-theme synced via single useEffect([theme]))
      const executeThemeSwitch = useCallback((targetTheme) => {
        setTheme(targetTheme);
        commitDataUpdate(prev => ({
          ...prev,
          settings: { ...(prev.settings || {}), theme: targetTheme }
        }));
      }, [commitDataUpdate]);

      const toggleTheme = useCallback(() => {
        const nextTheme = theme === 'dark' ? 'light' : 'dark';
        executeThemeSwitch(nextTheme);
      }, [theme, executeThemeSwitch]);

      // Export Backup Dialog
      const handleExportBackup = async () => {
        try {
          if (window.pywebview && window.pywebview.api) {
            const res = await window.pywebview.api.export_backup();
            if (res.status === 'ok') {
              showToast(res.message, 'success');
            } else if (res.status === 'cancelled') {
              showToast('Đã hủy chọn lưu file', 'info');
            }
          }
        } catch (err) {
          showToast('Lỗi khi sao lưu dữ liệu', 'error');
        }
      };

      // ==========================================
      // WINDOW CONTROLS HANDLERS (PYWEBVIEW NATIVE BRIDGE)
      // ==========================================
      const [isFullscreen, setIsFullscreen] = useState(false);

      const handleMinimizeWindow = useCallback(async () => {
        try {
          if (window.pywebview && window.pywebview.api && window.pywebview.api.minimize_window) {
            await window.pywebview.api.minimize_window();
          }
        } catch (err) {
          console.error("Lỗi thu nhỏ cửa sổ:", err);
        }
      }, []);

      const handleToggleFullscreen = useCallback(async () => {
        try {
          setIsFullscreen(prev => !prev);
          if (window.pywebview && window.pywebview.api && window.pywebview.api.toggle_fullscreen) {
            await window.pywebview.api.toggle_fullscreen();
          }
        } catch (err) {
          console.error("Lỗi toàn màn hình:", err);
        }
      }, []);

      const handleCloseWindow = useCallback(async () => {
        try {
          if (window.pywebview && window.pywebview.api && window.pywebview.api.close_window) {
            await window.pywebview.api.close_window();
          } else {
            window.close();
          }
        } catch (err) {
          console.error("Lỗi đóng ứng dụng:", err);
        }
      }, []);

      // Phím tắt F11 chuyển đổi toàn màn hình
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'F11') {
            e.preventDefault();
            handleToggleFullscreen();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [handleToggleFullscreen]);

      // Add or Save Habit
      const handleSaveHabit = (habitForm) => {
        commitDataUpdate(prev => {
          let updatedHabits;
          if (habitForm.id) {
            updatedHabits = prev.habits.map(h => h.id === habitForm.id ? { ...h, ...habitForm } : h);
          } else {
            const newHabit = {
              ...habitForm,
              id: 'habit-' + Date.now(),
              createdAt: todayStr
            };
            updatedHabits = [...prev.habits, newHabit];
          }
          return { ...prev, habits: updatedHabits };
        });
        setHabitModalOpen(false);
        setEditingHabit(null);
        showToast('Đã cập nhật danh sách thói quen', 'success');
      };

      // Delete Habit
      const handleConfirmDelete = () => {
        if (!habitToDelete) return;
        const targetId = habitToDelete.id;
        commitDataUpdate(prev => {
          const updatedHabits = prev.habits.filter(h => h.id !== targetId);
          const newLogs = {};
          for (const [d, dayHabits] of Object.entries(prev.logs)) {
            if (dayHabits[targetId]) {
              const copy = { ...dayHabits };
              delete copy[targetId];
              newLogs[d] = copy;
            } else {
              newLogs[d] = dayHabits;
            }
          }
          return { ...prev, habits: updatedHabits, logs: newLogs };
        });
        setDeleteModalOpen(false);
        setHabitToDelete(null);
        showToast('Đã xóa thói quen thành công', 'success');
      };

      // Close Delete Habit Modal on Escape key (R3 WAI-ARIA)
      useEffect(() => {
        if (!deleteModalOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setDeleteModalOpen(false);
            setHabitToDelete(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [deleteModalOpen]);

      // ==========================================
      // DRAG & DROP REORDER LOGIC
      // ==========================================
      const [draggedHabitId, setDraggedHabitId] = useState(null);
      const [dragOverHabitId, setDragOverHabitId] = useState(null);

      const handleDragStart = (e, habitId) => {
        setDraggedHabitId(habitId);
        e.dataTransfer.setData('text/plain', habitId);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e, habitId) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (dragOverHabitId !== habitId) {
          setDragOverHabitId(habitId);
        }
      };

      const handleDragLeave = (e, habitId) => {
        if (dragOverHabitId === habitId) {
          setDragOverHabitId(null);
        }
      };

      const handleDrop = (e, targetHabitId) => {
        e.preventDefault();
        const sourceHabitId = draggedHabitId || e.dataTransfer.getData('text/plain');
        setDraggedHabitId(null);
        setDragOverHabitId(null);

        if (!sourceHabitId || sourceHabitId === targetHabitId) return;

        let didReorder = false;
        commitDataUpdate(prev => {
          const habitsCopy = [...(prev.habits || [])];
          const fromIndex = habitsCopy.findIndex(h => h.id === sourceHabitId);
          const toIndex = habitsCopy.findIndex(h => h.id === targetHabitId);

          if (fromIndex === -1 || toIndex === -1) return prev;

          const [movedHabit] = habitsCopy.splice(fromIndex, 1);
          habitsCopy.splice(toIndex, 0, movedHabit);
          didReorder = true;
          return { ...prev, habits: habitsCopy };
        });

        if (didReorder) {
          showToast('Đã cập nhật thứ tự thói quen', 'success');
        }
      };

      const handleDragEnd = () => {
        setDraggedHabitId(null);
        setDragOverHabitId(null);
      };

      // ==========================================
      // DYNAMIC CATEGORY MANAGEMENT HANDLERS
      // ==========================================
      const handleSaveCategory = (catForm) => {
        let renamedFrom = null;
        commitDataUpdate(prev => {
          const currentCats = [...(prev.categories || [])];
          let updatedCats;
          let updatedHabits = [...(prev.habits || [])];

          if (catForm.id) {
            const oldCat = currentCats.find(c => c.id === catForm.id);
            const oldName = oldCat?.name;
            updatedCats = currentCats.map(c => c.id === catForm.id ? { ...c, ...catForm } : c);

            if (oldName && oldName !== catForm.name) {
              renamedFrom = oldName;
              updatedHabits = updatedHabits.map(h => h.category === oldName ? { ...h, category: catForm.name } : h);
            }
          } else {
            const newCat = {
              ...catForm,
              id: 'cat-' + Date.now(),
              isCustom: true
            };
            updatedCats = [...currentCats, newCat];
          }

          return { ...prev, categories: updatedCats, habits: updatedHabits };
        });

        if (renamedFrom && activeCategory === renamedFrom) {
          setActiveCategory(catForm.name);
        }

        showToast('Đã lưu danh mục thành công', 'success');
      };

      const handleDeleteCategory = (cat) => {
        if (!cat) return;
        if (isDefaultCategory(cat)) {
          showToast(`Không thể xóa danh mục hệ thống "${cat.name}"`, 'error');
          return;
        }

        const catName = (cat.name || '').trim();
        if (!catName) return;

        commitDataUpdate(prev => {
          const updatedCats = (prev.categories || []).filter(c => {
            if (cat.id && c.id) return c.id !== cat.id;
            return (c.name || '').trim().toLowerCase() !== catName.toLowerCase();
          });

          const habits = prev.habits || [];
          const affectedHabits = habits.filter(h => (h.category || '').trim().toLowerCase() === catName.toLowerCase());

          let updatedHabits = habits;
          if (affectedHabits.length > 0) {
            updatedHabits = habits.map(h => 
              (h.category || '').trim().toLowerCase() === catName.toLowerCase()
                ? { ...h, category: 'Chưa phân loại' }
                : h
            );

            const hasUncategorized = updatedCats.some(c => (c.name || '').trim().toLowerCase() === 'chưa phân loại');
            if (!hasUncategorized) {
              updatedCats.push({
                id: 'cat-uncategorized',
                name: 'Chưa phân loại',
                color: '#94A3B8',
                icon: 'layers',
                isDefault: true
              });
            }
          }

          return { ...prev, categories: updatedCats, habits: updatedHabits };
        });

        if ((activeCategory || '').trim().toLowerCase() === catName.toLowerCase()) {
          setActiveCategory('Tất cả');
        }

        showToast(`Đã xóa danh mục "${catName}" thành công`, 'success');
      };

      // Filtered habits
      const filteredHabits = useMemo(() => {
        if (!activeCategory || activeCategory === 'Tất cả') return data.habits || [];
        const normActive = activeCategory.trim().toLowerCase();
        return (data.habits || []).filter(h => (h.category || '').trim().toLowerCase() === normActive);
      }, [data.habits, activeCategory]);

      // Category Counts (Tính tự động theo danh mục động)
      const categoryCounts = useMemo(() => {
        const counts = { 'Tất cả': (data.habits || []).length };
        for (const c of (data.categories || [])) {
          counts[c.name] = 0;
        }
        for (const h of (data.habits || [])) {
          counts[h.category] = (counts[h.category] || 0) + 1;
        }
        return counts;
      }, [data.habits, data.categories]);

      // Current week dates
      const currentWeekDates = useMemo(() => {
        return getWeekDates(selectedMonday);
      }, [selectedMonday]);

      // Check if viewing current active week
      const isViewingCurrentWeek = useMemo(() => {
        return currentWeekDates.includes(todayStr);
      }, [currentWeekDates, todayStr]);

      // ==========================================
      // 4. MATHEMATICAL KPI ENGINE & STREAK CACHE (Delegated to js/logic.js, R2 Memoized)
      // ==========================================
      const habitStreaksMap = useMemo(
        () => computeHabitStreaksMap(data.habits, data.logs, todayStr),
        [data.habits, data.logs, todayStr]
      );

      const kpis = useMemo(
        () => computeDashboardKpis(data.habits, data.logs, todayStr, habitStreaksMap),
        [data.habits, data.logs, todayStr, habitStreaksMap]
      );

      // Daily completion counts for current week
      const weekDaySummaries = useMemo(
        () => computeWeekDaySummaries(data.habits, data.logs, currentWeekDates),
        [data.habits, data.logs, currentWeekDates]
      );

      // Navigate week
      const changeWeek = (offsetWeeks) => {
        setSelectedMonday(prev => {
          return new Date(prev.getFullYear(), prev.getMonth(), prev.getDate() + offsetWeeks * 7);
        });
      };

      const jumpToCurrentWeek = () => {
        setSelectedMonday(getMonday(parseLocalDate(todayStr)));
      };

      // Navigate month for heatmap
      const changeMonth = (offsetMonths) => {
        setSelectedMonth(prev => {
          const d = new Date(prev.year, prev.month + offsetMonths, 1);
          return { year: d.getFullYear(), month: d.getMonth() };
        });
      };

      const jumpToCurrentMonth = () => {
        const d = parseLocalDate(todayStr);
        setSelectedMonth({ year: d.getFullYear(), month: d.getMonth() });
      };

      // ==========================================
      // 5. RENDER BENTO GRID
      // ==========================================
      return (
        <div className="relative min-h-screen w-full flex flex-col">
          {/* Atmoscene Living Sky Background System */}
          <AtmosceneBackground theme={theme} />

          {/* TOP HEADER - Full-width native application bar with clear sky center */}
          <TopNavigationBar
            currentWeekDates={currentWeekDates}
            isViewingCurrentWeek={isViewingCurrentWeek}
            changeWeek={changeWeek}
            jumpToCurrentWeek={jumpToCurrentWeek}
            saveStatus={saveStatus}
            zoom={zoom}
            setZoom={setZoom}
            handleExportBackup={handleExportBackup}
            theme={theme}
            toggleTheme={toggleTheme}
            isFullscreen={isFullscreen}
            handleMinimizeWindow={handleMinimizeWindow}
            handleToggleFullscreen={handleToggleFullscreen}
            handleCloseWindow={handleCloseWindow}
          />

          {/* DASHBOARD CONTENT CONTAINER */}
          <div className="w-full max-w-[1800px] 2xl:max-w-[1920px] mx-auto px-4 pt-7 pb-5 md:px-8 md:pt-9 md:pb-6 flex flex-col gap-6 relative z-10 flex-1">

          {/* SECTION A: 4 KPI CARDS (Art-Directed Hero Monolith & Horological Telemetry) */}
          <KpiSummaryGrid
            kpis={kpis}
            zoom={zoom}
            isStackedLayout={isStackedLayout}
          />

    /** 6a. ComparativeChartCard: Reusable card wrapper for Week / Month / Year comparative charts in HabitGrowthModal */

      deltaRate,
      legendLeftDotClass = "bg-slate-400",
      legendLeftTextClass = "text-slate-400",

      habitColor,

    function HabitGrowthModal({ habit, data, todayStr, selectedMonday, streakInfo, onClose }) {
      const [chartTooltip, setChartTooltip] = useState(null);

      // Close on Escape key
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      const logs = data.logs || {};
      // Streak & Record (R2: reuse memoized streakInfo from parent when available)
      const currentStreak = useMemo(
        () => streakInfo?.current ?? calculateStreak(habit.id, logs, todayStr),
        [streakInfo, habit.id, logs, todayStr]
      );
      const recordStreak = useMemo(
        () => streakInfo?.record ?? calculateRecordStreak(habit.id, logs),
        [streakInfo, habit.id, logs]
      );

      // Category object
      const catObj = useMemo(() => {
        return (data.categories || []).find(c => c.name === habit.category);
      }, [data.categories, habit.category]);

      const habitColor = habit.color || '#6366F1';

      // Comparative analytics engines delegated to js/logic.js (R1)
      const weekAnalytics = useMemo(
        () => computeHabitWeekAnalytics(habit.id, logs, todayStr),
        [habit.id, logs, todayStr]
      );
      const monthAnalytics = useMemo(
        () => computeHabitMonthAnalytics(habit.id, logs, todayStr),
        [habit.id, logs, todayStr]
      );
      const yearAnalytics = useMemo(
        () => computeHabitYearAnalytics(habit.id, logs, todayStr),
        [habit.id, logs, todayStr]
      );

      return (
        <div
          className="animate-modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 md:p-8 liquid-glass-backdrop overflow-y-auto"
          onClick={(e) => {
            if (e.target === e.currentTarget) onClose();
          }}
        >
          <div
            className="animate-modal-dialog w-full max-w-7xl max-h-[92vh] overflow-y-auto p-5 sm:p-6 md:p-8 rounded-3xl liquid-glass-modal flex flex-col gap-6 shadow-2xl custom-scrollbar"
            role="dialog"
            aria-modal="true"
            aria-labelledby="habit-growth-title"
          >
            {/* 1. MODAL HEADER */}
            <header className="flex items-start justify-between gap-4 pb-4 border-b border-slate-200/60 dark:border-white/10">
              <div className="flex items-center gap-3.5">
                <div
                  className="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0 text-white shadow-lg border border-white/25"
                  style={{ backgroundColor: habitColor, boxShadow: `0 8px 24px ${habitColor}45` }}
                  aria-hidden="true"
                >
                  <Icon name={habit.icon || 'activity'} className="w-6 h-6 stroke-[2.2]" />
                </div>
                <div className="min-w-0">
                  <div className="flex items-center gap-2.5 flex-wrap">
                    <h2 id="habit-growth-title" className="text-xl md:text-2xl font-serif font-bold text-slate-900 dark:text-white tracking-wide truncate">
                      {habit.name}
                    </h2>
                    {catObj && (
                      <span
                        className="spring-pill inline-flex items-center gap-1.5 px-2.5 py-0.5 text-xs font-semibold rounded-xl border"
                        style={{
                          backgroundColor: `${catObj.color}15`,
                          color: catObj.color,
                          borderColor: `${catObj.color}35`
                        }}
                      >
                        <Icon name={catObj.icon} className="w-3 h-3" />
                        <span>{habit.category}</span>
                      </span>
                    )}
                    <span className="spring-pill inline-flex items-center gap-1 px-2.5 py-0.5 rounded-xl text-xs font-mono font-bold text-amber-500 bg-amber-500/10 border border-amber-500/25">
                      🔥 {currentStreak}d
                    </span>
                    <span className="spring-pill inline-flex items-center gap-1 px-2.5 py-0.5 rounded-xl text-xs font-mono text-slate-500 dark:text-slate-400 bg-slate-500/10 border border-slate-500/20">
                      Kỷ lục: {recordStreak}d
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    Phân tích chuyên sâu 3 đồ thị song song đối chiếu thực tế đến ngày <strong className="text-slate-700 dark:text-slate-200 font-mono">{todayStr}</strong>
                  </p>
                </div>
              </div>

              {/* Close Button */}
              <button
                type="button"
                onClick={onClose}
                className="spring-button p-2.5 rounded-2xl liquid-glass-control text-slate-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-200/50 dark:hover:bg-white/10 transition flex-shrink-0"
                title="Đóng bảng phân tích (Phím Esc)"
                aria-label="Đóng bảng phân tích"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </header>

            {/* 2. THREE SIMULTANEOUS COMPARATIVE CHARTS */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5 md:gap-6">

              {/* ========================================================== */}
              {/* CHART 1: SO SÁNH TUẦN (Tuần này vs Tuần trước)             */}
              {/* ========================================================== */}
              <ComparativeChartCard
                title="SO SÁNH TUẦN"
                subtitle="Tuần này vs Tuần trước (7 ngày)"
                deltaRate={weekAnalytics.deltaRate}
                legendLeftDotClass="bg-slate-400"
                legendLeftTextClass="text-slate-400"
                legendLeftLabel={`Tuần trước (${weekAnalytics.lastWeekElapsedActual}/${weekAnalytics.elapsedDays}d)`}
                habitColor={habitColor}
                legendRightLabel={`Tuần này (${weekAnalytics.thisWeekActual}/${weekAnalytics.elapsedDays}d)`}
                footerPrefix="Đối chiếu:"
                footerHighlight={weekAnalytics.timeframe}
                deltaAbs={weekAnalytics.deltaAbs}
                deltaAbsPairText={`${weekAnalytics.thisWeekActual} vs ${weekAnalytics.lastWeekElapsedActual}`}
              >
                {/* SVG Grouped Bar / Line Chart */}
                {(() => {
                  const svgWidth = 460;
                  const svgHeight = 220;
                  const padLeft = 34;
                  const padRight = 16;
                  const padTop = 22;
                  const padBottom = 28;
                  const chartW = svgWidth - padLeft - padRight;
                  const chartH = svgHeight - padTop - padBottom;
                  const slotW = chartW / 7;
                  const baselineY = padTop + chartH;

                  const pointsThis = [];
                  const pointsLast = [];

                  // Precalculate point coordinates for smooth splines
                  weekAnalytics.days.forEach((d, i) => {
                    const slotX = padLeft + i * slotW;
                    const centerX = slotX + slotW / 2;
                    const barW = 11;

                    // Last week height
                    const hLast = d.doneLast ? chartH * 0.9 : chartH * 0.12;
                    const yLast = padTop + chartH - hLast;
                    const xLast = centerX - barW - 1.5;

                    // This week height
                    const hThis = d.isFuture ? 0 : d.doneThis ? chartH * 0.9 : chartH * 0.12;
                    const yThis = padTop + chartH - hThis;
                    const xThis = centerX + 1.5;

                    pointsLast.push({ x: xLast + barW / 2, y: yLast, centerX, slotX });
                    if (!d.isFuture) {
                      pointsThis.push({ x: xThis + barW / 2, y: yThis, centerX, slotX });
                    }
                  });

                  const splineThis = buildMonotoneSplinePath(pointsThis, baselineY);
                  const splineLast = buildMonotoneSplinePath(pointsLast);

                  return (
                    <div className="relative chart-container-rel">
                      <svg
                        viewBox={`0 0 ${svgWidth} ${svgHeight}`}
                        className="w-full h-auto overflow-visible"
                        role="img"
                        aria-label={`Biểu đồ so sánh tuần của thói quen ${habit.name}`}
                      >
                        <defs>
                          <linearGradient id="hGradWeekThis" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor={habitColor} stopOpacity="1" />
                            <stop offset="100%" stopColor={habitColor} stopOpacity="0.6" />
                          </linearGradient>
                          <linearGradient id="hGradWeekLast" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#94A3B8" stopOpacity="0.8" />
                            <stop offset="100%" stopColor="#64748B" stopOpacity="0.4" />
                          </linearGradient>
                          <linearGradient id="hGradWeekArea" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor={habitColor} stopOpacity="0.25" />
                            <stop offset="65%" stopColor={habitColor} stopOpacity="0.06" />
                            <stop offset="100%" stopColor={habitColor} stopOpacity="0.0" />
                          </linearGradient>
                          <filter id="hModalWeekGlow" x="-10%" y="-10%" width="120%" height="120%">
                            <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor={habitColor} floodOpacity="0.25" />
                          </filter>
                        </defs>

                        {/* Grid lines: 0%, 50%, 100% */}
                        {[0, 50, 100].map(pct => {
                          const y = padTop + chartH - (pct / 100) * chartH;
                          return (
                            <g key={pct}>
                              <line
                                x1={padLeft}
                                y1={y}
                                x2={padLeft + chartW}
                                y2={y}
                                stroke="currentColor"
                                strokeOpacity="0.1"
                                strokeDasharray="3 3"
                              />
                              <text
                                x={padLeft - 6}
                                y={y + 3.5}
                                fontSize="9"
                                textAnchor="end"
                                fill="currentColor"
                                opacity="0.4"
                                fontFamily="JetBrains Mono"
                              >
                                {pct}%
                              </text>
                            </g>
                          );
                        })}

                        {/* Smooth Gradient Area Fill */}
                        {splineThis.areaPath && (
                          <path
                            d={splineThis.areaPath}
                            fill="url(#hGradWeekArea)"
                            className="pointer-events-none"
                          />
                        )}

                        {/* Day slots & Bars */}
                        {weekAnalytics.days.map((d, i) => {
                          const slotX = padLeft + i * slotW;
                          const centerX = slotX + slotW / 2;
                          const barW = 11;

                          // Last week height
                          const hLast = d.doneLast ? chartH * 0.9 : chartH * 0.12;
                          const yLast = padTop + chartH - hLast;
                          const xLast = centerX - barW - 1.5;

                          // This week height
                          const hThis = d.isFuture ? 0 : d.doneThis ? chartH * 0.9 : chartH * 0.12;
                          const yThis = padTop + chartH - hThis;
                          const xThis = centerX + 1.5;

                          return (
                            <g key={i}>
                              {/* Last week bar */}
                              <rect
                                x={xLast}
                                y={yLast}
                                width={barW}
                                height={hLast}
                                rx="2.5"
                                fill="url(#hGradWeekLast)"
                              />

                              {/* This week bar */}
                              {d.isFuture ? (
                                <rect
                                  x={xThis}
                                  y={padTop + chartH * 0.1}
                                  width={barW}
                                  height={chartH * 0.9}
                                  rx="2.5"
                                  fill="none"
                                  stroke="currentColor"
                                  strokeOpacity="0.2"
                                  strokeDasharray="2 2"
                                />
                              ) : (
                                <rect
                                  x={xThis}
                                  y={yThis}
                                  width={barW}
                                  height={hThis}
                                  rx="2.5"
                                  fill="url(#hGradWeekThis)"
                                />
                              )}

                              {/* Day Label */}
                              <text
                                x={centerX}
                                y={svgHeight - 10}
                                fontSize="10"
                                textAnchor="middle"
                                fill="currentColor"
                                fontWeight={d.isToday ? "bold" : "normal"}
                                opacity={d.isToday ? 1 : 0.6}
                                fontFamily="JetBrains Mono"
